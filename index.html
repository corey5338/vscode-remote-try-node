<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
    body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
    .page { display: inline-block; width: 150px; margin: 10px; border: 2px solid #444; padding: 5px; cursor: pointer; }
    .selected { border-color: #2563eb; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="application/pdf">
<button onclick="exportPdf()">保存する</button>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pdfDoc, pdfBytes;

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
            // バイナリデータを確実に取得
            pdfBytes = await file.arrayBuffer();
            
            // PDF.jsで解析
            const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
            const pdf = await loadingTask.promise;
            
            // PDFLibで編集用として読み込み
            pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            
            render(pdf);
        } catch (err) {
            alert("読み込み失敗: " + err.message);
        }
    });

    async function render(pdf) {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const div = document.createElement('div');
            div.className = 'page';
            div.innerHTML = `ページ ${i}<br><canvas id="c${i}"></canvas>`;
            container.appendChild(div);
            
            const page = await pdf.getPage(i);
            const canvas = document.getElementById('c' + i);
            const ctx = canvas.getContext('2d');
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
        }
    }

    async function exportPdf() {
        const savedBytes = await pdfDoc.save();
        const blob = new Blob([savedBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'output.pdf'; a.click();
    }
</script>
</body>
</html>
