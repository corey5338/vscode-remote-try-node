<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#3b82f6;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:linear-gradient(to bottom,#0f172a,#020617);
    color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;
}

.toolbar{
    position:sticky;
    top:12px;
    z-index:1000;

    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;

    padding:18px 22px;

    background:rgba(30,41,59,.9);

    backdrop-filter:blur(12px);

    border-radius:18px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

button{
    border:none;
    padding:10px 16px;
    border-radius:10px;
    background:#334155;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    background:#475569;
    transform:translateY(-1px);
}

button.primary{
    background:var(--accent);
}

button.danger{
    background:var(--danger);
}

.divider{
    width:1px;
    height:22px;
    background:#475569;
}

#status{
    margin-left:auto;
    color:var(--muted);
}

#pages{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:22px;
    margin-top:24px;
}

.page-item{
    background:var(--panel);
    border-radius:16px;
    overflow:hidden;
    border:2px solid transparent;
    transition:.15s;
    cursor:move;
}

.page-item:hover{
    transform:translateY(-2px);
}

.page-item.selected{
    border-color:var(--accent);
    background:#1d4ed8;
}

.preview{
    background:#0b1220;
    padding:10px;
}

canvas{
    width:100%;
    display:block;
    border-radius:10px;
    background:white;
}

.page-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
}

.page-num{
    font-size:.82rem;
    color:var(--muted);
}

.page-check{
    width:18px;
    height:18px;
    accent-color:var(--accent);
}

.placeholder{
    aspect-ratio:0.7;
    background:#111827;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#64748b;
    font-size:.8rem;
}

.empty{
    margin-top:120px;
    text-align:center;
    color:var(--muted);
}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="document.getElementById('fileInput').click()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <div class="divider"></div>

    <button onclick="undo()">
        Undo
    </button>

    <button class="danger" onclick="deleteSelected()">
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        style="background:#8b5cf6;"
        onclick="exportSelected()"
    >
        抽出保存
    </button>

    <button class="primary" onclick="exportPdf()">
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];
let historyStack = [];
let lastSelectedIndex = -1;

const visibleObserver =
    new IntersectionObserver(onVisible,{
        rootMargin:'500px'
    });

const renderQueue = [];

let renderRunning = false;

/* =========================================
   Status
========================================= */

function setStatus(text){

    document
    .getElementById('status')
    .textContent = text;

}

/* =========================================
   History
========================================= */

function saveHistory(){

    historyStack.push([...pageList]);

    if(historyStack.length > 30){

        historyStack.shift();

    }

}

/* =========================================
   Sortable
========================================= */

new Sortable(pagesContainer,{

    animation:180,

    ghostClass:'selected',

    onEnd:()=>{

        saveHistory();

        const newList = [];

        document
        .querySelectorAll('.page-item')
        .forEach(el=>{

            newList.push(el.pageData);

        });

        pageList = newList;

        updatePageNumbers();

        setStatus('ページ順変更');

    }

});

/* =========================================
   Load PDF
========================================= */

document
.getElementById('fileInput')
.onchange = e => {

    processFile(
        e.target.files[0],
        true
    );

};

async function processFile(file,isReset){

    try{

        if(isReset){

            cleanupAllPages();

            pageList = [];
            historyStack = [];

            pagesContainer.innerHTML = '';

        }

        setStatus('PDF読み込み中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(pdfBytes);

        const pdfjsDoc =
            await pdfjsLib
            .getDocument({
                data:pdfBytes.slice(0)
            }).promise;

        const total =
            pdfDoc.getPageCount();

        const fragment =
            document.createDocumentFragment();

        for(let i=0;i<total;i++){

            const pageData = {

                id:
                    crypto.randomUUID(),

                doc:
                    pdfDoc,

                pdfjsDoc:
                    pdfjsDoc,

                pageIndex:
                    i,

                selected:
                    false,

                thumb:
                    null,

                rendered:
                    false,

                rendering:
                    false,

                renderTask:
                    null,

                element:
                    null

            };

            pageList.push(pageData);

            const el =
                createPageElement(
                    pageData,
                    pageList.length - 1
                );

            fragment.appendChild(el);

        }

        pagesContainer.appendChild(fragment);

        setStatus(
            `${total}ページ読込完了`
        );

    }catch(err){

        console.error(err);

        setStatus('エラー');

    }

}

/* =========================================
   Create Page
========================================= */

function createPageElement(p,index){

    const div =
        document.createElement('div');

    div.className = 'page-item';

    div.dataset.id = p.id;

    div.pageData = p;

    p.element = div;

    div.innerHTML = `

        <div class="preview">

            <div class="placeholder">
                Loading...
            </div>

            <canvas style="display:none;"></canvas>

        </div>

        <div class="page-footer">

            <div class="page-num">
                Page ${index + 1}
            </div>

            <input
                type="checkbox"
                class="page-check"
            >

        </div>

    `;

    setupSelection(div,p,index);

    visibleObserver.observe(div);

    if(p.thumb){

        restoreThumbnail(p);

    }

    return div;

}

/* =========================================
   Selection
========================================= */

function setupSelection(div,p,index){

    const checkbox =
        div.querySelector('.page-check');

    checkbox.checked = p.selected;

    if(p.selected){

        div.classList.add('selected');

    }

    checkbox.addEventListener(
        'click',
        e=>e.stopPropagation()
    );

    checkbox.addEventListener(
        'change',
        ()=>{

            p.selected =
                checkbox.checked;

            div.classList.toggle(
                'selected',
                p.selected
            );

        }
    );

    div.onclick = e => {

        if(
            e.shiftKey &&
            lastSelectedIndex !== -1
        ){

            const start =
                Math.min(
                    lastSelectedIndex,
                    index
                );

            const end =
                Math.max(
                    lastSelectedIndex,
                    index
                );

            const items =
                Array.from(
                    pagesContainer.children
                );

            for(let i=start;i<=end;i++){

                items[i]
                .pageData
                .selected = true;

                items[i]
                .classList
                .add('selected');

                items[i]
                .querySelector('.page-check')
                .checked = true;

            }

        }else{

            p.selected = !p.selected;

            div.classList.toggle(
                'selected',
                p.selected
            );

            checkbox.checked =
                p.selected;

        }

        lastSelectedIndex = index;

    };

}

/* =========================================
   Visible Observer
========================================= */

function onVisible(entries){

    for(const entry of entries){

        if(!entry.isIntersecting)
            continue;

        const el =
            entry.target;

        const p =
            el.pageData;

        if(
            p.rendered ||
            p.rendering
        ) continue;

        renderQueue.push(p);

    }

    processRenderQueue();

}

/* =========================================
   Render Queue
========================================= */

async function processRenderQueue(){

    if(renderRunning) return;

    renderRunning = true;

    while(renderQueue.length){

        const p =
            renderQueue.shift();

        if(
            !p ||
            p.rendered ||
            p.rendering
        ){
            continue;
        }

        if(
            !p.element ||
            !document.body.contains(
                p.element
            )
        ){
            continue;
        }

        await renderThumbnail(p);

        await idle();

    }

    renderRunning = false;

}

function idle(){

    return new Promise(resolve=>{

        requestIdleCallback(
            ()=>resolve(),
            {
                timeout:100
            }
        );

    });

}

/* =========================================
   Thumbnail Render
========================================= */

async function renderThumbnail(p){

    if(
        p.rendered ||
        p.rendering
    ) return;

    if(
        !p.element ||
        !document.body.contains(
            p.element
        )
    ){
        return;
    }

    p.rendering = true;

    try{

        const page =
            await p.pdfjsDoc.getPage(
                p.pageIndex + 1
            );

        if(
            !p.element ||
            !document.body.contains(
                p.element
            )
        ){

            p.rendering = false;

            return;

        }

        const viewport =
            page.getViewport({
                scale:0.17
            });

        const canvas =
            p.element.querySelector('canvas');

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha:false
                }
            );

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        p.renderTask =
            page.render({

                canvasContext:ctx,

                viewport

            });

        await p.renderTask.promise;

        p.thumb =
            canvas.toDataURL(
                'image/webp',
                0.5
            );

        p.rendered = true;

        const placeholder =
            p.element.querySelector(
                '.placeholder'
            );

        if(placeholder){

            placeholder.remove();

        }

        canvas.style.display =
            'block';

    }catch(err){

        if(
            err?.name !==
            'RenderingCancelledException'
        ){

            console.error(err);

        }

    }

    p.renderTask = null;

    p.rendering = false;

}

/* =========================================
   Restore Thumbnail
========================================= */

function restoreThumbnail(p){

    if(
        !p.thumb ||
        !p.element
    ) return;

    const canvas =
        p.element.querySelector('canvas');

    const img =
        new Image();

    img.src = p.thumb;

    img.onload = ()=>{

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        canvas
        .getContext('2d')
        .drawImage(img,0,0);

    };

    const placeholder =
        p.element.querySelector(
            '.placeholder'
        );

    if(placeholder){

        placeholder.remove();

    }

    canvas.style.display =
        'block';

}

/* =========================================
   Delete
========================================= */

function deleteSelected(){

    const targets =
        pageList.filter(
            p=>p.selected
        );

    if(targets.length === 0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    saveHistory();

    targets.forEach(p=>{

        cleanupPage(p);

        if(p.element){

            p.element.remove();

        }

    });

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    updatePageNumbers();

    setStatus(
        `${targets.length}ページ削除`
    );

}

/* =========================================
   Cleanup
========================================= */

function cleanupPage(p){

    if(
        p.renderTask &&
        p.renderTask.cancel
    ){

        try{

            p.renderTask.cancel();

        }catch{}

    }

    p.rendering = false;

}

function cleanupAllPages(){

    pageList.forEach(cleanupPage);

}

/* =========================================
   Undo
========================================= */

function undo(){

    if(historyStack.length === 0)
        return;

    cleanupAllPages();

    pageList =
        historyStack.pop();

    render();

}

/* =========================================
   Render
========================================= */

function render(){

    pagesContainer.innerHTML = '';

    const fragment =
        document.createDocumentFragment();

    pageList.forEach((p,index)=>{

        let el =
            p.element;

        if(!el){

            el =
                createPageElement(
                    p,
                    index
                );

        }

        p.element = el;

        el.querySelector('.page-num')
        .textContent =
            `Page ${index + 1}`;

        fragment.appendChild(el);

        visibleObserver.observe(el);

    });

    pagesContainer.appendChild(fragment);

}

/* =========================================
   Utils
========================================= */

function updatePageNumbers(){

    document
    .querySelectorAll('.page-num')
    .forEach((el,index)=>{

        el.textContent =
            `Page ${index + 1}`;

    });

}

function clearSelection(){

    pageList.forEach(p=>{

        p.selected = false;

    });

    document
    .querySelectorAll('.page-item')
    .forEach(el=>{

        el.classList.remove(
            'selected'
        );

        el.querySelector('.page-check')
        .checked = false;

    });

}

/* =========================================
   Export
========================================= */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    setStatus('PDF生成中...');

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length === 0){

        alert(
            'ページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名',
            'extract.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

function downloadPdf(bytes,name){

    const blob =
        new Blob(
            [bytes],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('保存完了');

}

/* =========================================
   Add PDF
========================================= */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept =
        'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        const pages =
            await getPagesFromPdf(file);

        saveHistory();

        let insertIndex =
            pageList.length;

        const selectedIndex =
            pageList.findLastIndex(
                p=>p.selected
            );

        if(selectedIndex !== -1){

            insertIndex =
                selectedIndex + 1;

        }

        pageList.splice(
            insertIndex,
            0,
            ...pages
        );

        render();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib
        .PDFDocument
        .load(pdfBytes);

    const pdfjsDoc =
        await pdfjsLib
        .getDocument({
            data:pdfBytes.slice(0)
        }).promise;

    const pages = [];

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        pages.push({

            id:
                crypto.randomUUID(),

            doc:
                pdfDoc,

            pdfjsDoc:
                pdfjsDoc,

            pageIndex:
                i,

            selected:
                false,

            thumb:
                null,

            rendered:
                false,

            rendering:
                false,

            renderTask:
                null,

            element:
                null

        });

    }

    return pages;

}

</script>

</body>
</html>
