<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#3b82f6;
    --text:#f8fafc;
    --danger:#ef4444;
    --muted:#94a3b8;
    --border:#334155;
}

*{
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;

    margin:0;
    padding:20px;
}

/* =========================
   Toolbar
========================= */

.toolbar{

    position:sticky;
    top:20px;
    z-index:100;

    background:rgba(30,41,59,.95);

    backdrop-filter:blur(12px);

    padding:16px 24px;

    border-radius:16px;

    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    border:1px solid rgba(255,255,255,.05);

}

button{

    background:#334155;
    border:none;
    color:white;

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

    font-weight:600;

}

button:hover{

    transform:translateY(-1px);

    background:#475569;

}

button.primary{
    background:var(--accent);
}

button.primary:hover{
    background:#2563eb;
}

button.danger{
    background:var(--danger);
}

button.danger:hover{
    background:#dc2626;
}

.divider{
    width:1px;
    height:24px;
    background:#475569;
}

#status{

    margin-left:auto;

    color:var(--muted);

    font-size:.9rem;

}

/* =========================
   Pages
========================= */

#pages{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

    gap:20px;

    margin-top:24px;

}

.page-item{

    background:var(--panel);

    border-radius:14px;

    overflow:hidden;

    border:2px solid transparent;

    transition:.2s;

    cursor:move;

    box-shadow:
        0 4px 12px rgba(0,0,0,.2);

}

.page-item:hover{

    transform:translateY(-2px);

    border-color:#64748b;

}

.page-item.selected{

    border-color:var(--accent);

    box-shadow:
        0 0 0 2px rgba(59,130,246,.25);

}

.preview-wrap{

    padding:10px;

    background:#0b1220;

}

canvas{

    width:100%;

    display:block;

    border-radius:8px;

    background:white;

}

.page-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 12px;

    font-size:.8rem;

}

.page-num{
    color:var(--muted);
}

.page-check{

    width:18px;
    height:18px;

    accent-color:var(--accent);

    cursor:pointer;

}

.empty{

    margin-top:80px;

    text-align:center;

    color:var(--muted);

    font-size:1rem;

}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="document.getElementById('fileInput').click()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <div class="divider"></div>

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        onclick="exportSelected()"
        style="background:#8b5cf6;"
    >
        抽出して保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages">

    <div class="empty">
        PDFを読み込んでください
    </div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* =========================
   Data
========================= */

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

/* =========================
   Sortable
========================= */

new Sortable(document.getElementById('pages'), {

    animation:200,

    ghostClass:'selected',

    onEnd:() => {

        saveHistory();

        const container =
            document.getElementById('pages');

        const newOrder =
            Array.from(container.children)
            .map(div => parseInt(div.dataset.index));

        pageList =
            newOrder.map(i => pageList[i]);

        render();

    }

});

/* =========================
   Helpers
========================= */

function setStatus(text){

    document.getElementById('status').textContent = text;

}

function saveHistory(){

    historyStack.push(
        structuredClone(pageList)
    );

}

/* =========================
   Load PDF
========================= */

document
.getElementById('fileInput')
.onchange = (e) => {

    processFile(
        e.target.files[0],
        true
    );

};

async function processFile(file,isReset){

    if(!file) return;

    if(isReset){

        pageList = [];

        historyStack = [];

    }

    try{

        setStatus('PDF読込中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(pdfBytes);

        const total =
            pdfDoc.getPageCount();

        for(let i=0;i<total;i++){

            setStatus(
                `読み込み ${i+1}/${total}`
            );

            const thumb =
                await generateThumb(
                    pdfBytes,
                    i
                );

            pageList.push({

                doc:pdfDoc,

                pageIndex:i,

                thumb:thumb,

                selected:false

            });

        }

        render();

        setStatus('完了');

    }catch(err){

        console.error(err);

        setStatus('エラー');

    }

}

/* =========================
   Generate Thumb
========================= */

async function generateThumb(pdfBytes,pageIndex){

    const pdf =
        await pdfjsLib
        .getDocument({
            data:pdfBytes
        }).promise;

    const page =
        await pdf.getPage(pageIndex + 1);

    const viewport =
        page.getViewport({
            scale:0.25
        });

    const canvas =
        document.createElement('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({

        canvasContext:ctx,
        viewport:viewport

    }).promise;

    return canvas.toDataURL(
        'image/webp',
        0.6
    );

}

/* =========================
   Add PDF
========================= */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept = 'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        const selectedIndexes =
            pageList
            .map((p,i)=>
                p.selected ? i : -1
            )
            .filter(i=>i!==-1);

        const insertAfter =
            selectedIndexes.length > 0
            ? selectedIndexes[selectedIndexes.length-1]
            : pageList.length - 1;

        const newPages =
            await getPagesFromPdf(file);

        saveHistory();

        pageList.splice(
            insertAfter + 1,
            0,
            ...newPages
        );

        render();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const pages = [];

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib.PDFDocument.load(pdfBytes);

    const total =
        pdfDoc.getPageCount();

    for(let i=0;i<total;i++){

        setStatus(
            `挿入 ${i+1}/${total}`
        );

        const thumb =
            await generateThumb(
                pdfBytes,
                i
            );

        pages.push({

            doc:pdfDoc,

            pageIndex:i,

            thumb:thumb,

            selected:false

        });

    }

    return pages;

}

/* =========================
   Undo
========================= */

function undo(){

    if(historyStack.length === 0)
        return;

    pageList = historyStack.pop();

    render();

}

/* =========================
   Delete
========================= */

function deleteSelected(){

    const selectedCount =
        pageList.filter(
            p => p.selected
        ).length;

    if(selectedCount === 0){

        alert(
            '削除するページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p => !p.selected
        );

    render();

}

/* =========================
   Clear Selection
========================= */

function clearSelection(){

    pageList.forEach(p => {

        p.selected = false;

    });

    lastSelectedIndex = -1;

    render();

}

/* =========================
   Render
========================= */

function render(){

    const container =
        document.getElementById('pages');

    if(pageList.length === 0){

        container.innerHTML = `
            <div class="empty">
                PDFを読み込んでください
            </div>
        `;

        return;

    }

    container.innerHTML = '';

    pageList.forEach((p,i)=>{

        const div =
            document.createElement('div');

        div.className =
            'page-item' +
            (p.selected
                ? ' selected'
                : '');

        div.dataset.index = i;

        div.innerHTML = `

            <div class="preview-wrap">
                <canvas></canvas>
            </div>

            <div class="page-footer">

                <div class="page-num">
                    Page ${i+1}
                </div>

                <input
                    type="checkbox"
                    class="page-check"
                    ${p.selected ? 'checked' : ''}
                >

            </div>

        `;

        /* Canvas */

        const canvas =
            div.querySelector('canvas');

        const img = new Image();

        img.src = p.thumb;

        img.onload = ()=>{

            canvas.width = img.width;

            canvas.height = img.height;

            canvas
            .getContext('2d')
            .drawImage(img,0,0);

        };

        /* Checkbox */

        const checkbox =
            div.querySelector('.page-check');

        checkbox.addEventListener(
            'click',
            e => e.stopPropagation()
        );

        checkbox.addEventListener(
            'change',
            ()=>{

                p.selected =
                    checkbox.checked;

                render();

            }
        );

        /* Click */

        div.onclick = (e)=>{

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(
                        lastSelectedIndex,
                        i
                    );

                const end =
                    Math.max(
                        lastSelectedIndex,
                        i
                    );

                for(
                    let j=start;
                    j<=end;
                    j++
                ){

                    pageList[j].selected = true;

                }

            }else{

                p.selected =
                    !p.selected;

            }

            lastSelectedIndex = i;

            render();

        };

        container.appendChild(div);

    });

}

/* =========================
   Export PDF
========================= */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    setStatus('PDF生成中...');

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('保存完了');

}

/* =========================
   Export Selected
========================= */

async function exportSelected(){

    const selected =
        pageList.filter(
            p => p.selected
        );

    if(selected.length === 0){

        alert(
            '抽出するページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名',
            'extracted.pdf'
        );

    if(!name) return;

    setStatus('抽出中...');

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('抽出完了');

}

</script>

</body>
</html>
