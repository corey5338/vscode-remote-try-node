<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; position: sticky; top: 0; z-index: 10; padding: 10px 0; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 4px solid transparent; }
    .page-item.selected { border-color: #3b82f6; }
    canvas { width: 100%; pointer-events: none; background: white; border-radius: 4px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <input type="file" id="addInput" accept="application/pdf" style="display:none">
    <button onclick="document.getElementById('addInput').click()" style="background:#3b82f6">指定位置へ追加</button>
    <button onclick="undo()">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444">選択削除</button>
    <button onclick="exportPdf()" style="background:#10b981">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pages = []; 
    let history = [];

    function saveHistory() {
        history.push(pages.map(p => ({ blob: p.blob, selected: p.selected })));
    }

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for (let i = 0; i < pages.length; i++) {
            const p = pages[i];
            const div = document.createElement('div');
            div.className = 'page-item' + (p.selected ? ' selected' : '');
            div.onclick = () => { p.selected = !p.selected; div.classList.toggle('selected'); };
            
            const canvas = document.createElement('canvas');
            div.appendChild(canvas);
            container.appendChild(div);

            const buffer = await p.blob.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
    }

    async function addPages(file) {
        saveHistory();
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
        
        // 追加するページデータを生成
        const newPages = [];
        for (let i = 0; i < pdf.getPageCount(); i++) {
            const doc = await PDFLib.PDFDocument.create();
            const [p] = await doc.copyPages(pdf, [i]);
            doc.addPage(p);
            const bytes = await doc.save();
            newPages.push({ blob: new Blob([bytes], {type: 'application/pdf'}), selected: false });
        }

        // 挿入位置の特定（最初の選択ページを探す）
        const selectedIndex = pages.findIndex(p => p.selected);
        
        if (selectedIndex !== -1) {
            // 選択したページの直前に挿入
            pages.splice(selectedIndex, 0, ...newPages);
        } else {
            // 何も選択されていなければ末尾に挿入
            pages.push(...newPages);
        }
        
        render();
    }

    async function loadPdf(file) {
        pages = [];
        await addPages(file);
    }

    function deleteSelected() {
        if (!pages.some(p => p.selected)) return;
        saveHistory();
        pages = pages.filter(p => !p.selected);
        render();
    }

    function undo() {
        if (history.length === 0) return;
        pages = history.pop();
        render();
    }

    new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: (evt) => {
            if (evt.oldIndex === evt.newIndex) return;
            saveHistory();
            const movedItem = pages.splice(evt.oldIndex, 1)[0];
            pages.splice(evt.newIndex, 0, movedItem);
        }
    });

    async function exportPdf() {
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const buffer = await p.blob.arrayBuffer();
            const doc = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
        a.download = "edited.pdf";
        a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdf(e.target.files[0]));
    document.getElementById('addInput').addEventListener('change', (e) => addPages(e.target.files[0]));
</script>
</body>
</html>
