<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];

function setStatus(text){

    document
        .getElementById('status')
        .textContent = text;

}

function openFileDialog(){

    document
        .getElementById('fileInput')
        .click();

}

document
.getElementById('fileInput')
.onchange = async e => {

    const file =
        e.target.files[0];

    if(!file) return;

    setStatus('PDF読み込み中...');

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib.PDFDocument.load(
            pdfBytes
        );

    pageList = [];

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        pageList.push({

            id:crypto.randomUUID(),

            doc:pdfDoc,

            pdfBytes,

            pageIndex:i,

            selected:false,

            rotation:0,

            thumb:null

        });

    }

    render();

    setStatus(
        `${pdfDoc.getPageCount()}ページ読み込み`
    );

};

function render(){

    if(pageList.length===0){

        pagesContainer.innerHTML = `

            <div class="empty">

                <h2>
                    PDFを読み込んでください
                </h2>

            </div>

        `;

        return;

    }

    pagesContainer.innerHTML='';

    pageList.forEach((p,index)=>{

        const div =
            document.createElement('div');

        div.className='page-item';

        if(p.selected){

            div.classList.add('selected');

        }

        div.innerHTML=`

            <div class="preview-wrap">

                <div class="loading">
                    Page ${index+1}
                </div>

            </div>

            <div class="badge">
                PDF
            </div>

            ${
                p.rotation !== 0
                ?
                `
                <div class="rotate-badge">
                    ${p.rotation}°
                </div>
                `
                :
                ''
            }

            <div class="page-footer">

                <div>

                    <div class="page-num">
                        Page ${index+1}
                    </div>

                    <div class="page-meta">
                        元ページ ${p.pageIndex+1}
                    </div>

                </div>

            </div>

        `;

        div.onclick = ()=>{

            p.selected =
                !p.selected;

            render();

        };

        pagesContainer.appendChild(div);

    });

}

function clearSelection(){

    pageList.forEach(
        p=>p.selected=false
    );

    render();

}

function rotateSelected(deg){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '回転ページを選択してください'
        );

        return;

    }

    selected.forEach(p=>{

        p.rotation += deg;

    });

    render();

}

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

}

function undo(){

    alert(
        'Undoは次段階で再実装してください'
    );

}

function moveSelectedPages(){

    alert(
        '移動機能は次段階で再実装してください'
    );

}

async function addPdf(){

    alert(
        '追加機能は次段階で再実装してください'
    );

}

async function exportPdf(){

    if(pageList.length===0){

        return;

    }

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        if(p.rotation !== 0){

            page.setRotation(
                PDFLib.degrees(
                    p.rotation
                )
            );

        }

        newPdf.addPage(page);

    }

    const blob =
        new Blob(

            [await newPdf.save()],

            {
                type:'application/pdf'
            }

        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        'edited.pdf';

    a.click();

}

async function exportSelected(){

    alert(
        '抽出保存は次段階で再実装してください'
    );

}

new Sortable(pagesContainer,{

    animation:180

});

</script>

</body>
