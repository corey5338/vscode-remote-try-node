<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Simple</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; }
    .toolbar { background: #1e293b; padding: 15px; display: flex; gap: 10px; position: sticky; top: 0; }
    .page-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; }
    canvas { width: 100%; border-radius: 4px; background: white; }
    button { cursor: pointer; background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 4px; }
    .del { background: #ef4444; margin-top: 5px; width: 100%; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="undo()">Undo</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages" class="page-list"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pages = []; // {bytes: Uint8Array, id: number}
    let history = [];

    async function addFile(file) {
        history.push([...pages]);
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pdf = await PDFLib.PDFDocument.load(bytes);
        const count = pdf.getPageCount();
        for (let i = 0; i < count; i++) {
            const temp = await PDFLib.PDFDocument.create();
            const [p] = await temp.copyPages(pdf, [i]);
            temp.addPage(p);
            pages.push({ bytes: await temp.save(), id: Date.now() + i });
        }
        render();
    }

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for (let i = 0; i < pages.length; i++) {
            const p = pages[i];
            const div = document.createElement('div');
            div.className = 'page-item';
            
            const canvas = document.createElement('canvas');
            const doc = await pdfjsLib.getDocument({ data: p.bytes }).promise;
            const page = await doc.getPage(1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            
            div.appendChild(canvas);
            div.innerHTML += `<button class="del" onclick="deletePage(${i})">削除</button>`;
            container.appendChild(div);
        }
    }

    function deletePage(i) {
        history.push([...pages]);
        pages.splice(i, 1);
        render();
    }

    function undo() {
        if(history.length === 0) return;
        pages = history.pop();
        render();
    }

    async function exportPdf() {
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(p.bytes);
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()]));
        a.download = "output.pdf";
        a.click();
    }

    new Sortable(document.getElementById('pages'), {
        onEnd: () => {
            const newPages = [];
            document.querySelectorAll('.page-item').forEach(el => {
                const idx = Array.from(el.parentNode.children).indexOf(el);
                newPages.push(pages[idx]);
            });
            pages = newPages;
        }
    });

    document.getElementById('fileInput').addEventListener('change', (e) => addFile(e.target.files[0]));
</script>
</body>
</html>
