<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - High Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; cursor: pointer; border: 4px solid transparent; position: relative; }
    .page-item.selected { border-color: #3b82f6; }
    .page-number { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    img { width: 100%; pointer-events: none; background: white; border-radius: 4px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="document.getElementById('addInput').click()" style="background:#3b82f6">指定位置へ追加</button>
    <input type="file" id="addInput" accept="application/pdf" style="display:none">
    <button onclick="deleteSelected()" style="background:#ef4444">選択削除</button>
    <button onclick="exportPdf()" style="background:#10b981">名前を付けて保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pages = []; 

    // 重要：削除時は配列操作とDOMの削除だけ行う（PDFの再描画はしない）
    function deleteSelected() {
        const container = document.getElementById('pages');
        const newPages = [];
        Array.from(container.children).forEach((el, index) => {
            if (el.classList.contains('selected')) {
                el.remove();
            } else {
                newPages.push(pages[index]);
            }
        });
        pages = newPages;
        updateNumbers();
    }

    function updateNumbers() {
        document.querySelectorAll('.page-number').forEach((el, i) => el.textContent = i + 1);
    }

    async function addPages(file) {
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
        const container = document.getElementById('pages');
        
        for (let i = 0; i < pdf.getPageCount(); i++) {
            const doc = await PDFLib.PDFDocument.create();
            const [p] = await doc.copyPages(pdf, [i]);
            doc.addPage(p);
            const blob = new Blob([await doc.save()], {type: 'application/pdf'});
            
            // サムネイル生成
            const imgUrl = await generateThumbnail(blob);
            
            const div = document.createElement('div');
            div.className = 'page-item';
            div.innerHTML = `<div class="page-number">${pages.length + 1}</div><img src="${imgUrl}">`;
            div.onclick = () => div.classList.toggle('selected');
            container.appendChild(div);
            
            pages.push({ blob });
        }
    }

    // PDF全体を解析せず、1ページだけ画像を生成してキャッシュ
    async function generateThumbnail(blob) {
        const buffer = await blob.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.createElement('canvas');
        const vp = page.getViewport({ scale: 0.2 });
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        return canvas.toDataURL('image/webp', 0.5); // WebPで軽量化
    }

    async function exportPdf() {
        const fileName = prompt("ファイル名:", "edited.pdf");
        if (!fileName) return;
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(await p.blob.arrayBuffer());
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
        a.download = fileName; a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        document.getElementById('pages').innerHTML = ''; pages = [];
        addPages(e.target.files[0]);
    });
    document.getElementById('addInput').addEventListener('change', (e) => addPages(e.target.files[0]));
</script>
</body>
</html>
