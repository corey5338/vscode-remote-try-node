<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#020617;
    --panel:#0f172a;
    --panel2:#111827;
    --accent:#3b82f6;
    --accent2:#60a5fa;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top left,#1e293b 0%,#020617 45%);
    color:var(--text);
    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;
}

.toolbar{

    position:sticky;
    top:0;
    z-index:999;

    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;

    padding:18px;

    background:rgba(15,23,42,.92);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);

}

button{

    border:none;

    padding:11px 16px;

    border-radius:12px;

    cursor:pointer;

    color:white;

    font-weight:700;

    transition:.18s;

    background:#334155;

}

button:hover{

    transform:translateY(-1px);

    filter:brightness(1.08);

}

button.primary{
    background:var(--accent);
}

button.danger{
    background:var(--danger);
}

#status{

    margin-left:auto;

    color:var(--muted);

    font-size:.9rem;

}

#pages{

    padding:20px;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:20px;

}

.page-item{

    background:rgba(15,23,42,.9);

    border:
        2px solid transparent;

    border-radius:18px;

    overflow:hidden;

    transition:.15s;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);

}

.page-item:hover{

    transform:translateY(-2px);

    border-color:#475569;

}

.page-item.selected{

    border-color:var(--accent);

    box-shadow:
        0 0 0 2px rgba(59,130,246,.25),
        0 8px 20px rgba(0,0,0,.35);

}

.preview{

    aspect-ratio:0.7;

    background:#0b1220;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

.preview canvas{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}

.placeholder{

    color:#64748b;

    font-size:.9rem;

}

.page-footer{

    padding:12px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.page-num{

    font-size:.85rem;

    color:#cbd5e1;

    font-weight:700;

}

.page-check{

    width:18px;
    height:18px;

    cursor:pointer;

}

.empty{

    width:100%;

    text-align:center;

    padding:80px 20px;

    color:#64748b;

}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button
        onclick="document.getElementById('fileInput').click()"
    >
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        onclick="exportSelected()"
    >
        抽出保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages">

    <div class="empty">
        PDFを読み込んでください
    </div>

</div>

<script>

/* =====================================================
   requestIdleCallback Polyfill
===================================================== */

window.requestIdleCallback =
window.requestIdleCallback ||
function(cb){

    return setTimeout(()=>{

        cb({
            didTimeout:false,
            timeRemaining:()=>0
        });

    },1);

};

/* =====================================================
   PDF Worker
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

/* =====================================================
   Elements
===================================================== */

const pagesContainer =
    document.getElementById('pages');

const statusEl =
    document.getElementById('status');

/* =====================================================
   State
===================================================== */

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

const renderQueue = [];

let renderRunning = false;

/* =====================================================
   Status
===================================================== */

function setStatus(text){

    statusEl.textContent = text;

}

/* =====================================================
   History
===================================================== */

function saveHistory(){

    historyStack.push([...pageList]);

    if(historyStack.length > 30){

        historyStack.shift();

    }

}

/* =====================================================
   Sortable
===================================================== */

new Sortable(pagesContainer,{

    animation:180,

    ghostClass:'selected',

    onEnd:(evt)=>{

        saveHistory();

        const moved =
            pageList.splice(evt.oldIndex,1)[0];

        pageList.splice(
            evt.newIndex,
            0,
            moved
        );

        render();

    }

});

/* =====================================================
   File Load
===================================================== */

document
.getElementById('fileInput')
.onchange = e => {

    processFile(
        e.target.files[0],
        true
    );

};

/* =====================================================
   Process File
===================================================== */

async function processFile(file,isReset){

    try{

        if(isReset){

            cleanupRenderTasks();

            pageList = [];

            historyStack = [];

        }

        setStatus('PDF読込中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(pdfBytes);

        const pdfjsDoc =
            await pdfjsLib
            .getDocument({
                data:pdfBytes.slice(0)
            }).promise;

        const total =
            pdfDoc.getPageCount();

        for(let i=0;i<total;i++){

            pageList.push({

                id:
                    crypto.randomUUID(),

                doc:
                    pdfDoc,

                pdfjsDoc:
                    pdfjsDoc,

                pageIndex:i,

                selected:false,

                rendered:false,

                rendering:false,

                renderTask:null,

                thumb:null

            });

        }

        render();

        setStatus(
            `${total}ページ読込完了`
        );

    }catch(err){

        console.error(err);

        setStatus('エラー');

    }

}

/* =====================================================
   Render
===================================================== */

function render(){

    if(pageList.length === 0){

        pagesContainer.innerHTML = `
            <div class="empty">
                PDFを読み込んでください
            </div>
        `;

        return;

    }

    pagesContainer.innerHTML = '';

    const fragment =
        document.createDocumentFragment();

    pageList.forEach((p,index)=>{

        const div =
            document.createElement('div');

        div.className =
            'page-item';

        if(p.selected){

            div.classList.add(
                'selected'
            );

        }

        div.innerHTML = `

            <div class="preview">

                <div class="placeholder">
                    Loading...
                </div>

                <canvas
                    style="display:none;"
                ></canvas>

            </div>

            <div class="page-footer">

                <div class="page-num">
                    Page ${index + 1}
                </div>

                <input
                    type="checkbox"
                    class="page-check"
                    ${p.selected ? 'checked' : ''}
                >

            </div>

        `;

        setupSelection(
            div,
            p,
            index
        );

        fragment.appendChild(div);

        const canvas =
            div.querySelector('canvas');

        if(p.thumb){

            restoreThumbnail(
                p,
                canvas,
                div
            );

        }else{

            queueThumbnail(
                p,
                canvas,
                div
            );

        }

    });

    pagesContainer.appendChild(fragment);

}

/* =====================================================
   Selection
===================================================== */

function setupSelection(div,p,index){

    const checkbox =
        div.querySelector('.page-check');

    checkbox.onclick =
        e => e.stopPropagation();

    checkbox.onchange = ()=>{

        p.selected =
            checkbox.checked;

        div.classList.toggle(
            'selected',
            p.selected
        );

    };

    div.onclick = e => {

        if(
            e.shiftKey &&
            lastSelectedIndex !== -1
        ){

            const start =
                Math.min(
                    lastSelectedIndex,
                    index
                );

            const end =
                Math.max(
                    lastSelectedIndex,
                    index
                );

            for(
                let i=start;
                i<=end;
                i++
            ){

                pageList[i]
                .selected = true;

            }

        }else{

            p.selected =
                !p.selected;

        }

        lastSelectedIndex =
            index;

        render();

    };

}

/* =====================================================
   Queue
===================================================== */

function queueThumbnail(
    p,
    canvas,
    div
){

    renderQueue.push({
        p,
        canvas,
        div
    });

    processQueue();

}

async function processQueue(){

    if(renderRunning)
        return;

    renderRunning = true;

    while(renderQueue.length){

        const item =
            renderQueue.shift();

        if(!item)
            continue;

        const {
            p,
            canvas,
            div
        } = item;

        if(
            p.rendered ||
            p.rendering
        ){
            continue;
        }

        await renderThumbnail(
            p,
            canvas,
            div
        );

        await idle();

    }

    renderRunning = false;

}

function idle(){

    return new Promise(resolve=>{

        requestIdleCallback(()=>{

            resolve();

        });

    });

}

/* =====================================================
   Thumbnail
===================================================== */

async function renderThumbnail(
    p,
    canvas,
    div
){

    try{

        p.rendering = true;

        const page =
            await p.pdfjsDoc.getPage(
                p.pageIndex + 1
            );

        const viewport =
            page.getViewport({
                scale:0.22
            });

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha:false
                }
            );

        p.renderTask =
            page.render({

                canvasContext:ctx,

                viewport

            });

        await p.renderTask.promise;

        p.thumb =
            canvas.toDataURL(
                'image/webp',
                0.55
            );

        p.rendered = true;

        const placeholder =
            div.querySelector(
                '.placeholder'
            );

        if(placeholder){

            placeholder.remove();

        }

        canvas.style.display =
            'block';

    }catch(err){

        if(
            err?.name !==
            'RenderingCancelledException'
        ){

            console.error(err);

        }

    }

    p.renderTask = null;

    p.rendering = false;

}

/* =====================================================
   Restore
===================================================== */

function restoreThumbnail(
    p,
    canvas,
    div
){

    const img =
        new Image();

    img.src = p.thumb;

    img.onload = ()=>{

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        canvas
        .getContext('2d')
        .drawImage(
            img,
            0,
            0
        );

        const placeholder =
            div.querySelector(
                '.placeholder'
            );

        if(placeholder){

            placeholder.remove();

        }

        canvas.style.display =
            'block';

    };

}

/* =====================================================
   Delete
===================================================== */

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length === 0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

}

/* =====================================================
   Undo
===================================================== */

function undo(){

    if(
        historyStack.length === 0
    ) return;

    pageList =
        historyStack.pop();

    render();

}

/* =====================================================
   Clear Selection
===================================================== */

function clearSelection(){

    pageList.forEach(p=>{

        p.selected = false;

    });

    render();

}

/* =====================================================
   Export
===================================================== */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length === 0){

        alert(
            'ページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名',
            'extract.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

function downloadPdf(bytes,name){

    const blob =
        new Blob(
            [bytes],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

}

/* =====================================================
   Add PDF
===================================================== */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept =
        'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        const pages =
            await getPagesFromPdf(file);

        saveHistory();

        let insertIndex =
            pageList.length;

        const selectedIndex =
            pageList.findLastIndex(
                p=>p.selected
            );

        if(selectedIndex !== -1){

            insertIndex =
                selectedIndex + 1;

        }

        pageList.splice(
            insertIndex,
            0,
            ...pages
        );

        render();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib
        .PDFDocument
        .load(pdfBytes);

    const pdfjsDoc =
        await pdfjsLib
        .getDocument({
            data:pdfBytes.slice(0)
        }).promise;

    const pages = [];

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        pages.push({

            id:
                crypto.randomUUID(),

            doc:
                pdfDoc,

            pdfjsDoc:
                pdfjsDoc,

            pageIndex:i,

            selected:false,

            rendered:false,

            rendering:false,

            renderTask:null,

            thumb:null

        });

    }

    return pages;

}

/* =====================================================
   Cleanup
===================================================== */

function cleanupRenderTasks(){

    pageList.forEach(p=>{

        if(
            p.renderTask &&
            p.renderTask.cancel
        ){

            try{

                p.renderTask.cancel();

            }catch{}

        }

    });

}

</script>

</body>
</html>
