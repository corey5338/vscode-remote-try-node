<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Architect Pro - Phase5</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#020617;
    --panel:#1e293b;
    --panel2:#334155;
    --accent:#3b82f6;
    --accent2:#60a5fa;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    background:
        radial-gradient(circle at top left,#1e293b 0%,#020617 45%),
        #020617;

    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;
}

.toolbar{

    position:sticky;
    top:16px;
    z-index:100;

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;

    padding:16px 20px;

    border-radius:18px;

    background:rgba(15,23,42,.92);

    backdrop-filter:blur(12px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);

}

button{

    border:none;

    color:white;

    background:var(--panel2);

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    transition:.15s;

    font-weight:600;

}

button:hover{

    transform:translateY(-1px);

    background:#475569;

}

button.primary{

    background:var(--accent);

}

button.primary:hover{

    background:var(--accent2);

}

button.danger{

    background:var(--danger);

}

.zoom-group{

    display:flex;
    gap:6px;

}

#status{

    margin-left:auto;

    color:var(--muted);

    font-size:.9rem;

}

#pages{

    display:grid;

    gap:18px;

    margin-top:22px;

    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

}

body[data-size="S"] #pages{

    grid-template-columns:
        repeat(auto-fill,minmax(110px,1fr));

}

body[data-size="M"] #pages{

    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

}

body[data-size="L"] #pages{

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

}

.page-item{

    position:relative;

    background:rgba(30,41,59,.92);

    border:2px solid transparent;

    border-radius:16px;

    padding:12px;

    overflow:hidden;

    cursor:move;

    transition:.12s;

    box-shadow:
        0 8px 24px rgba(0,0,0,.25);

}

.page-item:hover{

    transform:translateY(-3px);

    border-color:#64748b;

}

.page-item.selected{

    border-color:var(--accent);

    background:#1e3a8a;

}

.preview-wrap{

    position:relative;

    aspect-ratio:0.7;

    border-radius:10px;

    overflow:hidden;

    background:#0f172a;

}

canvas{

    width:100%;
    height:100%;

    display:block;

    border-radius:10px;

}

.loading{

    position:absolute;
    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(15,23,42,.55);

    color:#cbd5e1;

    font-size:.85rem;

}

.page-num{

    margin-top:10px;

    text-align:center;

    color:#cbd5e1;

    font-size:.85rem;

}

.empty{

    margin-top:40px;

    padding:40px;

    border-radius:20px;

    background:rgba(30,41,59,.5);

    text-align:center;

    color:#94a3b8;

}

</style>
</head>
<body data-size="M">

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="openFileDialog()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        onclick="exportSelected()"
        style="background:#8b5cf6;"
    >
        抽出保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div class="zoom-group">

        <button onclick="setZoom('S')">
            S
        </button>

        <button onclick="setZoom('M')">
            M
        </button>

        <button onclick="setZoom('L')">
            L
        </button>

    </div>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

const renderQueue = [];

let rendering = false;

const visibleObserver =
new IntersectionObserver(

    entries => {

        entries.forEach(entry => {

            if(entry.isIntersecting){

                const index =
                    Number(
                        entry.target.dataset.index
                    );

                queueRender(index);

            }

        });

    },

    {
        rootMargin:'1000px'
    }

);

function setStatus(text){

    document
        .getElementById('status')
        .textContent = text;

}

function openFileDialog(){

    document
        .getElementById('fileInput')
        .click();

}

document
.getElementById('fileInput')
.onchange = e => {

    if(e.target.files[0]){

        processFile(
            e.target.files[0],
            true
        );

    }

};

function saveHistory(){

    historyStack.push(

        structuredClone(pageList)

    );

}

async function processFile(file,isReset){

    try{

        if(isReset){

            pageList = [];

            historyStack = [];

            pagesContainer.innerHTML='';

        }

        setStatus('PDF読み込み中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const total =
            pdfDoc.getPageCount();

        for(let i = 0; i < total; i++){

            pageList.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                thumb:null,

                rendering:false

            });

        }

        renderVisiblePages();

        setStatus(
            `${total}ページ読み込み`
        );

    }catch(e){

        console.error(e);

        setStatus('エラー');

    }

}

async function addPdf(){

    const input =
        document.createElement('input');

    input.type='file';

    input.accept='application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        saveHistory();

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const total =
            pdfDoc.getPageCount();

        const selected =
            pageList.findLastIndex(
                p=>p.selected
            );

        const insertPos =
            selected >= 0
            ? selected + 1
            : pageList.length;

        const newPages = [];

        for(let i = 0; i < total; i++){

            newPages.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                thumb:null,

                rendering:false

            });

        }

        pageList.splice(
            insertPos,
            0,
            ...newPages
        );

        renderVisiblePages();

    };

    input.click();

}

function renderVisiblePages(){

    pagesContainer.innerHTML='';

    const fragment =
        document.createDocumentFragment();

    pageList.forEach((p,index)=>{

        const div =
            createPageElement(p,index);

        fragment.appendChild(div);

    });

    pagesContainer.appendChild(fragment);

}

function createPageElement(p,index){

    const div =
        document.createElement('div');

    div.className='page-item';

    div.dataset.index=index;

    if(p.selected){

        div.classList.add('selected');

    }

    div.innerHTML=`

        <div class="preview-wrap">

            <canvas></canvas>

            <div class="loading">
                Loading...
            </div>

        </div>

        <div class="page-num">
            Page ${index + 1}
        </div>

    `;

    div.onclick = e => {

        const idx =
            Number(div.dataset.index);

        if(
            e.shiftKey &&
            lastSelectedIndex !== -1
        ){

            const start =
                Math.min(
                    idx,
                    lastSelectedIndex
                );

            const end =
                Math.max(
                    idx,
                    lastSelectedIndex
                );

            for(let i=start;i<=end;i++){

                pageList[i].selected=true;

            }

        }else{

            pageList[idx].selected =
                !pageList[idx].selected;

        }

        lastSelectedIndex = idx;

        updateSelectionUI();

    };

    visibleObserver.observe(div);

    if(p.thumb){

        drawThumb(index);

    }

    return div;

}

function updateSelectionUI(){

    Array.from(
        pagesContainer.children
    ).forEach((div,index)=>{

        div.classList.toggle(
            'selected',
            pageList[index].selected
        );

    });

}

function queueRender(index){

    const page = pageList[index];

    if(!page) return;

    if(page.thumb) return;

    if(page.rendering) return;

    renderQueue.push(index);

    processQueue();

}

async function processQueue(){

    if(rendering) return;

    rendering = true;

    while(renderQueue.length){

        const index =
            renderQueue.shift();

        const page =
            pageList[index];

        if(!page) continue;

        if(page.thumb) continue;

        page.rendering = true;

        try{

            await renderThumbnail(index);

        }catch(e){

            console.error(e);

        }

        page.rendering = false;

        await idle();

    }

    rendering = false;

}

function idle(){

    return new Promise(resolve=>{

        requestIdleCallback(
            ()=>resolve(),
            {timeout:50}
        );

    });

}

async function renderThumbnail(index){

    const p = pageList[index];

    if(!p) return;

    const scale =
        getCurrentScale();

    const pdf =
        await pdfjsLib.getDocument({

            data:p.pdfBytes.slice(0)

        }).promise;

    const page =
        await pdf.getPage(
            p.pageIndex + 1
        );

    const viewport =
        page.getViewport({
            scale
        });

    const canvas =
        document.createElement('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    await page.render({

        canvasContext:ctx,

        viewport

    }).promise;

    p.thumb =
        canvas.toDataURL(
            'image/webp',
            0.55
        );

    drawThumb(index);

}

function getCurrentScale(){

    const size =
        document.body.dataset.size;

    if(size === 'S') return 0.08;

    if(size === 'L') return 0.22;

    return 0.14;

}

function drawThumb(index){

    const div =
        pagesContainer.children[index];

    if(!div) return;

    const p = pageList[index];

    if(!p.thumb) return;

    const canvas =
        div.querySelector('canvas');

    const loading =
        div.querySelector('.loading');

    const img =
        new Image();

    img.src = p.thumb;

    img.onload = ()=>{

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        canvas
            .getContext('2d')
            .drawImage(img,0,0);

        if(loading){

            loading.remove();

        }

    };

}

function clearSelection(){

    pageList.forEach(
        p=>p.selected=false
    );

    updateSelectionUI();

}

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    lastSelectedIndex = -1;

    renderVisiblePages();

    setStatus(
        `${selected.length}ページ削除`
    );

}

function undo(){

    if(historyStack.length===0){

        return;

    }

    pageList =
        historyStack.pop();

    renderVisiblePages();

    setStatus('Undo');

}

function setZoom(size){

    document.body.dataset.size=size;

    pageList.forEach(p=>{

        p.thumb=null;

    });

    renderVisiblePages();

    setStatus(
        `表示サイズ: ${size}`
    );

}

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '抽出ページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            'ファイル名',
            'selected.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

}

new Sortable(pagesContainer,{

    animation:180,

    ghostClass:'selected',

    onEnd:(evt)=>{

        saveHistory();

        const moved =
            pageList.splice(
                evt.oldIndex,
                1
            )[0];

        pageList.splice(
            evt.newIndex,
            0,
            moved
        );

        renderVisiblePages();

    }

});

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='a'
        ){

            e.preventDefault();

            pageList.forEach(
                p=>p.selected=true
            );

            updateSelectionUI();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='z'
        ){

            e.preventDefault();

            undo();

        }

        if(e.key==='Delete'){

            deleteSelected();

        }

        if(e.key==='Escape'){

            clearSelection();

        }

    }
);

</script>
</body>
</html>
