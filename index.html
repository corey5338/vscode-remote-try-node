<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#020617;
    --bg2:#0f172a;
    --panel:rgba(15,23,42,.82);
    --panel2:#111827;
    --accent:#3b82f6;
    --accent2:#60a5fa;
    --danger:#ef4444;
    --success:#10b981;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:22px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top left,#1e293b 0%,#020617 42%),
        linear-gradient(to bottom,#020617,#0f172a);

    color:var(--text);

    font-family:
        Inter,
        "Segoe UI",
        system-ui,
        sans-serif;
}

.app-header{
    padding:22px 24px 0;
}

.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.title-wrap h1{
    margin:0;
    font-size:2rem;
    font-weight:800;
    const selectedCount = pageList.filter(p=>p.selected).length;
    if(selectedCount === 0){
        alert('削除するページを選択してください');
        return;
    }

    saveHistory();

    pageList = pageList.filter(p => !p.selected);

    render();

    setStatus(`${selectedCount}ページ削除`);

}

async function render(){

    updateStats();

    if(pageList.length === 0){

        pagesContainer.innerHTML = `
            <div class="empty">
                <h2>PDFを読み込んでください</h2>
                <p>
                    新規読み込みからPDFを選択してください
                </p>
            </div>
        `;

        return;

    }

    pagesContainer.innerHTML = '';

    for(let i = 0; i < pageList.length; i++){

        const p = pageList[i];

        const div = document.createElement('div');

        div.className = 'page-item';

        if(p.selected){
            div.classList.add('selected');
        }

        div.dataset.index = i;

        div.innerHTML = `

            <div class="page-topbar">

                <input
                    type="checkbox"
                    class="page-checkbox"
                    ${p.selected ? 'checked' : ''}
                >

                <div class="page-chip">
                    PDF
                </div>

            </div>

            <div class="page-preview">
                <canvas></canvas>
            </div>

            <div class="page-footer">

                <div>
                    <div class="page-num">
                        Page ${i + 1}
                    </div>

                    <div class="page-meta">
                        元ページ ${p.pageIndex + 1}
                    </div>
                </div>

            </div>

        `;

        const checkbox = div.querySelector('.page-checkbox');

        checkbox.addEventListener('click', e => {
            e.stopPropagation();
        });

        checkbox.addEventListener('change', () => {

            p.selected = checkbox.checked;

            render();

        });

        div.onclick = (e) => {

            if(e.shiftKey && lastSelectedIndex !== -1){

                const start = Math.min(lastSelectedIndex, i);

                const end = Math.max(lastSelectedIndex, i);

                for(let j = start; j <= end; j++){
                    pageList[j].selected = true;
                }

            }else{

                p.selected = !p.selected;

            }

            lastSelectedIndex = i;

            render();

        };

        pagesContainer.appendChild(div);

        const canvas = div.querySelector('canvas');

        lazyRenderThumbnail(p, canvas);

    }

    updateStats();

}
