<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#3b82f6;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    background:
        radial-gradient(circle at top left,#1e293b,#0f172a 45%);

    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;
}

/* Toolbar */

.toolbar{

    position:sticky;
    top:12px;
    z-index:1000;

    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;

    padding:18px 22px;

    background:
        rgba(30,41,59,.92);

    backdrop-filter:blur(12px);

    border-radius:18px;

    box-shadow:
        0 12px 32px rgba(0,0,0,.35);

}

button{

    border:none;

    padding:10px 16px;

    border-radius:10px;

    background:#334155;

    color:white;

    font-weight:600;

    cursor:pointer;

    transition:.18s;

}

button:hover{

    transform:translateY(-1px);

    background:#475569;

}

button.primary{

    background:var(--accent);

}

button.danger{

    background:var(--danger);

}

.divider{

    width:1px;
    height:22px;

    background:#475569;

}

#status{

    margin-left:auto;

    color:var(--muted);

}

/* Pages */

#pages{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:22px;

    margin-top:24px;

}

.page-item{

    background:var(--panel);

    border-radius:16px;

    overflow:hidden;

    border:2px solid transparent;

    transition:.18s;

    cursor:move;

    box-shadow:
        0 6px 18px rgba(0,0,0,.22);

}

.page-item:hover{

    transform:translateY(-3px);

    border-color:#64748b;

}

.page-item.selected{

    border-color:var(--accent);

    background:#1d4ed8;

}

.preview{

    background:#0b1220;

    padding:10px;

}

canvas{

    width:100%;

    display:block;

    border-radius:10px;

    background:white;

}

.page-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 12px;

}

.page-num{

    color:var(--muted);

    font-size:.82rem;

    font-weight:600;

}

.page-check{

    width:18px;
    height:18px;

    accent-color:var(--accent);

}

.empty{

    margin-top:120px;

    text-align:center;

    color:var(--muted);

}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="document.getElementById('fileInput').click()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <div class="divider"></div>

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        style="background:#8b5cf6;"
        onclick="exportSelected()"
    >
        抽出して保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];
let historyStack = [];
let lastSelectedIndex = -1;

/* =========================
   Sortable
========================= */

new Sortable(pagesContainer,{

    animation:200,

    ghostClass:'selected',

    onEnd:()=>{

        saveHistory();

        const newList = [];

        document
        .querySelectorAll('.page-item')
        .forEach(el=>{

            newList.push(el.pageData);

        });

        pageList = newList;

        updatePageNumbers();

        setStatus('ページ順変更');

    }

});

/* =========================
   Status
========================= */

function setStatus(text){

    document
    .getElementById('status')
    .textContent = text;

}

/* =========================
   History
========================= */

function saveHistory(){

    historyStack.push([...pageList]);

}

/* =========================
   Load PDF
========================= */

document
.getElementById('fileInput')
.onchange = (e)=>{

    processFile(
        e.target.files[0],
        true
    );

};

async function processFile(file,isReset){

    try{

        if(isReset){

            pageList = [];

            historyStack = [];

            pagesContainer.innerHTML = '';

        }

        setStatus('PDF読み込み中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(pdfBytes);

        const pdfjsDoc =
            await pdfjsLib
            .getDocument({
                data:pdfBytes.slice(0)
            }).promise;

        const total =
            pdfDoc.getPageCount();

        for(let i=0;i<total;i++){

            setStatus(
                `読み込み ${i+1}/${total}`
            );

            const pageData = {

                doc:pdfDoc,

                pdfjsDoc:pdfjsDoc,

                pageIndex:i,

                selected:false

            };

            pageList.push(pageData);

            const el =
                createPageElement(
                    pageData,
                    pageList.length - 1
                );

            pagesContainer.appendChild(el);

        }

        setStatus('完了');

    }catch(err){

        console.error(err);

        setStatus('エラー');

    }

}

/* =========================
   Add PDF
========================= */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept = 'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        const pages =
            await getPagesFromPdf(file);

        saveHistory();

        let insertIndex =
            pageList.length;

        const selectedIndex =
            pageList.findLastIndex(
                p=>p.selected
            );

        if(selectedIndex !== -1){

            insertIndex =
                selectedIndex + 1;

        }

        pageList.splice(
            insertIndex,
            0,
            ...pages
        );

        render();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib
        .PDFDocument
        .load(pdfBytes);

    const pdfjsDoc =
        await pdfjsLib
        .getDocument({
            data:pdfBytes.slice(0)
        }).promise;

    const pages = [];

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        pages.push({

            doc:pdfDoc,

            pdfjsDoc:pdfjsDoc,

            pageIndex:i,

            selected:false

        });

    }

    return pages;

}

/* =========================
   Create Page Element
========================= */

function createPageElement(
    p,
    index
){

    const div =
        document.createElement('div');

    div.className =
        'page-item';

    div.pageData = p;

    div.innerHTML = `

        <div class="preview">
            <canvas></canvas>
        </div>

        <div class="page-footer">

            <div class="page-num">
                Page ${index + 1}
            </div>

            <input
                type="checkbox"
                class="page-check"
            >

        </div>

    `;

    const checkbox =
        div.querySelector('.page-check');

    checkbox.checked =
        p.selected;

    if(p.selected){

        div.classList.add(
            'selected'
        );

    }

    checkbox.addEventListener(
        'click',
        e=>e.stopPropagation()
    );

    checkbox.addEventListener(
        'change',
        ()=>{

            p.selected =
                checkbox.checked;

            div.classList.toggle(
                'selected',
                p.selected
            );

        }
    );

    div.addEventListener(
        'click',
        (e)=>{

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(
                        lastSelectedIndex,
                        index
                    );

                const end =
                    Math.max(
                        lastSelectedIndex,
                        index
                    );

                const items =
                    Array.from(
                        pagesContainer.children
                    );

                for(
                    let i=start;
                    i<=end;
                    i++
                ){

                    items[i]
                    .pageData
                    .selected = true;

                    items[i]
                    .classList
                    .add('selected');

                    items[i]
                    .querySelector('.page-check')
                    .checked = true;

                }

            }else{

                p.selected =
                    !p.selected;

                div.classList.toggle(
                    'selected',
                    p.selected
                );

                checkbox.checked =
                    p.selected;

            }

            lastSelectedIndex = index;

        }
    );

    renderThumbnail(
        p,
        div.querySelector('canvas')
    );

    return div;

}

/* =========================
   Thumbnail
========================= */

async function renderThumbnail(
    p,
    canvas
){

    if(p.rendered){

        const img =
            new Image();

        img.src =
            p.rendered;

        img.onload = ()=>{

            canvas.width =
                img.width;

            canvas.height =
                img.height;

            canvas
            .getContext('2d')
            .drawImage(
                img,
                0,
                0
            );

        };

        return;

    }

    const page =
        await p.pdfjsDoc.getPage(
            p.pageIndex + 1
        );

    const viewport =
        page.getViewport({
            scale:0.22
        });

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    await page.render({

        canvasContext:
            canvas.getContext('2d'),

        viewport:viewport

    }).promise;

    p.rendered =
        canvas.toDataURL(
            'image/webp',
            0.6
        );

}

/* =========================
   Render
========================= */

function render(){

    if(pageList.length === 0){

        pagesContainer.innerHTML = `
            <div class="empty">
                PDFを読み込んでください
            </div>
        `;

        return;

    }

    const existingMap = new Map();

    document
    .querySelectorAll('.page-item')
    .forEach(el=>{

        existingMap.set(
            el.pageData,
            el
        );

    });

    pagesContainer.innerHTML = '';

    pageList.forEach((p,index)=>{

        let el =
            existingMap.get(p);

        if(!el){

            el =
                createPageElement(
                    p,
                    index
                );

        }

        el.dataset.index = index;

        el.querySelector('.page-num')
        .textContent =
            `Page ${index + 1}`;

        const checkbox =
            el.querySelector('.page-check');

        checkbox.checked =
            p.selected;

        el.classList.toggle(
            'selected',
            p.selected
        );

        pagesContainer.appendChild(el);

    });

}

/* =========================
   Update Page Numbers
========================= */

function updatePageNumbers(){

    document
    .querySelectorAll('.page-num')
    .forEach((el,index)=>{

        el.textContent =
            `Page ${index + 1}`;

    });

}

/* =========================
   Delete
========================= */

function deleteSelected(){

    const selectedCount =
        pageList.filter(
            p=>p.selected
        ).length;

    if(selectedCount === 0){

        alert(
            '削除するページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

    setStatus(
        `${selectedCount}ページ削除`
    );

}

/* =========================
   Clear Selection
========================= */

function clearSelection(){

    pageList.forEach(p=>{

        p.selected = false;

    });

    render();

}

/* =========================
   Undo
========================= */

function undo(){

    if(historyStack.length === 0)
        return;

    pageList =
        historyStack.pop();

    render();

}

/* =========================
   Export PDF
========================= */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名:',
            'edited.pdf'
        );

    if(!name) return;

    setStatus('PDF生成中...');

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(let p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download = name;

    a.click();

    setStatus('保存完了');

}

/* =========================
   Export Selected
========================= */

async function exportSelected(){

    const selectedPages =
        pageList.filter(
            p=>p.selected
        );

    if(selectedPages.length === 0){

        alert(
            '抽出ページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名:',
            'extracted.pdf'
        );

    if(!name) return;

    setStatus('抽出中...');

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(let p of selectedPages){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('抽出完了');

}

</script>

</body>
</html>
