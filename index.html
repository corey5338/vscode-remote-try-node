<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #111; color: white; font-family: sans-serif; }
    .toolbar { background: #222; padding: 10px; display: flex; gap: 10px; position: sticky; top: 0; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
    .page { background: #333; border: 3px solid transparent; cursor: grab; padding: 5px; }
    .page.selected { border-color: #3b82f6; }
    canvas { width: 100%; pointer-events: none; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="deleteSelected()">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let originalPdfDoc = null; 
    let pagesData = [];

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 読み込み直前にメモリをクリーンアップ
        originalPdfDoc = null;
        pagesData = [];
        document.getElementById('pages').innerHTML = '';

        try {
            const bytes = await file.arrayBuffer();
            
            // 読み込み用として明確に配列をコピーして使用
            const uint8Array = new Uint8Array(bytes);
            originalPdfDoc = await PDFLib.PDFDocument.load(uint8Array);
            const pdf = await pdfjsLib.getDocument({ data: uint8Array }).promise;

            for (let i = 0; i < pdf.numPages; i++) {
                const page = await pdf.getPage(i + 1);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const vp = page.getViewport({ scale: 0.2 });
                canvas.width = vp.width; canvas.height = vp.height;
                await page.render({ canvasContext: ctx, viewport: vp }).promise;
                
                pagesData.push({ originalIndex: i, canvas: canvas, selected: false });
            }
            render();
        } catch (err) {
            alert("読み込みエラー: " + err.message);
        }
    });

    function render() {
        const pagesEl = document.getElementById('pages');
        pagesEl.innerHTML = '';
        pagesData.forEach((p) => {
            const div = document.createElement('div');
            div.className = `page ${p.selected ? 'selected' : ''}`;
            div.onclick = () => { p.selected = !p.selected; div.className = `page ${p.selected ? 'selected' : ''}`; };
            div.appendChild(p.canvas);
            pagesEl.appendChild(div);
        });
    }

    new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: (evt) => {
            const item = pagesData.splice(evt.oldIndex, 1)[0];
            pagesData.splice(evt.newIndex, 0, item);
        }
    });

    function deleteSelected() {
        pagesData = pagesData.filter(p => !p.selected);
        render();
    }

    async function exportPdf() {
        if (!originalPdfDoc) return;
        const newPdf = await PDFLib.PDFDocument.create();
        for (const p of pagesData) {
            const [copied] = await newPdf.copyPages(originalPdfDoc, [p.originalIndex]);
            newPdf.addPage(copied);
        }
        const bytes = await newPdf.save();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        a.download = 'edited.pdf';
        a.click();
    }
</script>
</body>
</html>
