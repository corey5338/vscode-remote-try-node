<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Architect Pro Ultimate Stable</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{

    --bg:#020617;
    --panel:#0f172a;
    --panel2:#1e293b;

    --accent:#2563eb;
    --danger:#dc2626;

    --text:#f8fafc;
    --muted:#94a3b8;

}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:
        Inter,
        sans-serif;

    height:100vh;

    overflow:hidden;

}

.app{

    display:grid;

    grid-template-columns:
        270px 1fr;

    height:100vh;

}

.sidebar{

    background:var(--panel);

    padding:18px;

    overflow:auto;

    border-right:
        1px solid #334155;

}

.main{

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

.content{

    flex:1;

    overflow:auto;

    padding:20px;

}

.group{

    margin-bottom:18px;

    background:
        rgba(255,255,255,.03);

    padding:14px;

    border-radius:18px;

}

.group-title{

    color:var(--muted);

    margin-bottom:12px;

    font-size:.8rem;

    font-weight:700;

}

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    margin-bottom:10px;

    cursor:pointer;

    background:#334155;

    color:white;

    font-weight:700;

    transition:
        transform .12s,
        filter .12s;

}

button:hover{

    transform:translateY(-1px);

    filter:brightness(1.08);

}

.primary{

    background:var(--accent);

}

.danger{

    background:var(--danger);

}

input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#020617;

    color:white;

    margin-bottom:10px;

}

#pages{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(210px,1fr));

    gap:18px;

}

.page{

    background:var(--panel2);

    border-radius:18px;

    padding:12px;

    border:2px solid transparent;

    cursor:pointer;

    transition:
        transform .12s,
        border-color .12s;

}

.page:hover{

    transform:translateY(-2px);

}

.page.selected{

    border-color:#3b82f6;

}

.preview{

    aspect-ratio:0.7;

    background:#0b1120;

    border-radius:12px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

.preview img{

    width:100%;

    height:100%;

    object-fit:contain;

}

.loading{

    color:#94a3b8;

    font-size:.8rem;

}

.statusbar{

    height:42px;

    border-top:
        1px solid #334155;

    display:flex;

    align-items:center;

    padding:0 14px;

    background:#0f172a;

}

.rotate-badge{

    position:absolute;

    top:8px;
    left:8px;

    background:
        rgba(0,0,0,.6);

    padding:5px 8px;

    border-radius:999px;

    font-size:.7rem;

}

</style>
</head>
<body>

<div class="app">

<div class="sidebar">

<h2>PDF Architect</h2>

<div class="group">

<div class="group-title">
読み込み
</div>

<input
    type="file"
    id="fileInput"
    hidden
    accept="application/pdf"
>

<button
    class="primary"
    onclick="openFileDialog()"
>
新規読み込み
</button>

<button onclick="addPdf()">
PDF追加
</button>

<input
    id="insertInput"
    type="number"
    min="1"
    placeholder="追加位置"
>

</div>

<div class="group">

<div class="group-title">
編集
</div>

<button onclick="moveSelectedPages()">
選択ページ移動
</button>

<input
    id="moveInput"
    type="number"
    min="1"
    placeholder="移動先"
>

<button onclick="rotateSelected(90)">
右回転
</button>

<button onclick="rotateSelected(-90)">
左回転
</button>

<button onclick="undo()">
Undo
</button>

<button
    class="danger"
    onclick="deleteSelected()"
>
削除
</button>

<button onclick="clearSelection()">
選択解除
</button>

</div>

<div class="group">

<div class="group-title">
保存
</div>

<button
    class="primary"
    onclick="exportSelected()"
>
抽出保存
</button>

<button
    class="primary"
    onclick="exportPdf()"
>
全保存
</button>

</div>

</div>

<div class="main">

<div class="content">

<div id="pages"></div>

</div>

<div class="statusbar">

<div id="status">
Ready
</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

const thumbCache = new Map();

const pdfRenderCache = new Map();

const renderQueue = [];

let activeRenderers = 0;

const MAX_RENDERERS = 2;

let observer;

function setStatus(text){

    document
        .getElementById('status')
        .textContent = text;

}

function openFileDialog(){

    document
        .getElementById('fileInput')
        .click();

}

document
.getElementById('fileInput')
.onchange = e=>{

    const file =
        e.target.files[0];

    if(file){

        processFile(file,true);

    }

};

function validatePageNumber(value,max){

    if(value.trim()===''){

        return null;

    }

    const num =
        parseInt(value,10);

    if(Number.isNaN(num)){

        return null;

    }

    if(num <= 0){

        return null;

    }

    if(num > max + 1){

        return max + 1;

    }

    return num;

}

function saveHistory(){

    historyStack.push(

        pageList.map(p=>({

            ...p

        }))

    );

    if(historyStack.length > 15){

        historyStack.shift();

    }

}

async function processFile(file,isReset){

    try{

        if(isReset){

            pageList = [];

            historyStack = [];

        }

        setStatus('PDF読み込み中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        for(
            let i=0;
            i<pdfDoc.getPageCount();
            i++
        ){

            pageList.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                rotation:0,

                thumb:null,

                rendering:false,

                fileName:file.name

            });

        }

        render();

        setStatus(
            `${pdfDoc.getPageCount()}ページ読み込み`
        );

    }catch(e){

        console.error(e);

        setStatus('エラー');

    }

}

async function addPdf(){

    const pos =
        validatePageNumber(

            document
            .getElementById('insertInput')
            .value,

            pageList.length

        );

    if(pos === null){

        alert(
            '1以上の追加位置を入力してください'
        );

        return;

    }

    const input =
        document.createElement('input');

    input.type='file';

    input.accept='application/pdf';

    input.onchange = async e=>{

        const file =
            e.target.files[0];

        if(!file) return;

        saveHistory();

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const insertPages = [];

        for(
            let i=0;
            i<pdfDoc.getPageCount();
            i++
        ){

            insertPages.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                rotation:0,

                thumb:null,

                rendering:false,

                fileName:file.name

            });

        }

        pageList.splice(
            pos - 1,
            0,
            ...insertPages
        );

        render();

    };

    input.click();

}

function render(){

    if(observer){

        observer.disconnect();

    }

    pagesContainer.innerHTML='';

    const fragment =
        document.createDocumentFragment();

    pageList.forEach((p,index)=>{

        const div =
            document.createElement('div');

        div.className='page';

        div.dataset.index=index;

        if(p.selected){

            div.classList.add('selected');

        }

        div.innerHTML=`

            <div class="preview">

                ${
                    p.thumb
                    ?
                    `
                    <img
                        src="${p.thumb}"
                        style="
                            transform:
                                rotate(${p.rotation}deg);
                        "
                    >
                    `
                    :
                    `
                    <div class="loading">
                        Loading...
                    </div>
                    `
                }

                ${
                    p.rotation !== 0
                    ?
                    `
                    <div class="rotate-badge">
                        ${p.rotation}°
                    </div>
                    `
                    :
                    ''
                }

            </div>

            <div style="margin-top:10px;">

                <div>
                    <b>
                        Page ${index+1}
                    </b>
                </div>

                <div style="
                    color:#94a3b8;
                    font-size:.8rem;
                ">
                    元ページ ${p.pageIndex+1}
                </div>

            </div>

        `;

        div.onclick = e=>{

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(
                        index,
                        lastSelectedIndex
                    );

                const end =
                    Math.max(
                        index,
                        lastSelectedIndex
                    );

                for(let i=start;i<=end;i++){

                    pageList[i].selected = true;

                }

            }else{

                p.selected =
                    !p.selected;

            }

            lastSelectedIndex =
                index;

            updateSelectionUI();

        };

        fragment.appendChild(div);

    });

    pagesContainer.appendChild(fragment);

    setupObserver();

}

function setupObserver(){

    observer =
        new IntersectionObserver(

        entries=>{

            entries.forEach(entry=>{

                if(entry.isIntersecting){

                    const index =
                        Number(
                            entry.target.dataset.index
                        );

                    queueRender(index);

                }

            });

        },

        {
            rootMargin:'600px'
        }

    );

    Array.from(
        pagesContainer.children
    ).forEach(div=>{

        observer.observe(div);

    });

}

function queueRender(index){

    const p =
        pageList[index];

    if(!p) return;

    if(p.thumb) return;

    if(p.rendering) return;

    if(renderQueue.includes(index)){

        return;

    }

    renderQueue.push(index);

    processRenderQueue();

}

async function processRenderQueue(){

    while(

        activeRenderers < MAX_RENDERERS &&
        renderQueue.length > 0

    ){

        const index =
            renderQueue.shift();

        activeRenderers++;

        generateThumbnail(index)
        .finally(()=>{

            activeRenderers--;

            processRenderQueue();

        });

    }

}

async function getPdfRenderer(p){

    const key =
        p.fileName;

    if(pdfRenderCache.has(key)){

        return pdfRenderCache.get(key);

    }

    const pdf =
        await pdfjsLib.getDocument({

            data:p.pdfBytes.slice(0)

        }).promise;

    pdfRenderCache.set(key,pdf);

    return pdf;

}

async function generateThumbnail(index){

    const p =
        pageList[index];

    if(!p) return;

    if(p.thumb) return;

    if(p.rendering) return;

    p.rendering = true;

    const timeout =
        setTimeout(()=>{

            p.rendering = false;

        },15000);

    try{

        const cacheKey =
            `${p.fileName}_${p.pageIndex}`;

        if(thumbCache.has(cacheKey)){

            p.thumb =
                thumbCache.get(cacheKey);

            updateThumbnail(index);

            return;

        }

        const pdf =
            await getPdfRenderer(p);

        const page =
            await pdf.getPage(
                p.pageIndex + 1
            );

        const viewport =
            page.getViewport({
                scale:0.18
            });

        const canvas =
            document.createElement('canvas');

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha:false
                }
            );

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        await new Promise(resolve=>{

            requestIdleCallback(
                async()=>{

                    await page.render({

                        canvasContext:ctx,

                        viewport

                    }).promise;

                    resolve();

                },

                {
                    timeout:3000
                }
            );

        });

        p.thumb =
            canvas.toDataURL(
                'image/webp',
                0.68
            );

        thumbCache.set(
            cacheKey,
            p.thumb
        );

        updateThumbnail(index);

        canvas.width = 1;
        canvas.height = 1;

        page.cleanup();

    }catch(e){

        console.error(e);

    }finally{

        clearTimeout(timeout);

        p.rendering = false;

    }

}

function updateThumbnail(index){

    const div =
        pagesContainer.children[index];

    if(!div) return;

    const p =
        pageList[index];

    if(!p) return;

    const wrap =
        div.querySelector('.preview');

    wrap.innerHTML=`

        <img
            src="${p.thumb}"
            style="
                transform:
                    rotate(${p.rotation}deg);
            "
        >

        ${
            p.rotation !== 0
            ?
            `
            <div class="rotate-badge">
                ${p.rotation}°
            </div>
            `
            :
            ''
        }

    `;

}

function updateSelectionUI(){

    Array.from(
        pagesContainer.children
    ).forEach((div,index)=>{

        div.classList.toggle(

            'selected',

            pageList[index].selected

        );

    });

}

function clearSelection(){

    pageList.forEach(
        p=>p.selected=false
    );

    updateSelectionUI();

}

function rotateSelected(deg){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '回転ページを選択してください'
        );

        return;

    }

    saveHistory();

    selected.forEach(p=>{

        p.rotation += deg;

    });

    render();

}

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

    setStatus(
        `${selected.length}ページ削除`
    );

}

function moveSelectedPages(){

    const target =
        validatePageNumber(

            document
            .getElementById('moveInput')
            .value,

            pageList.length

        );

    if(target === null){

        alert(
            '1以上の移動先ページ番号を入力してください'
        );

        return;

    }

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '移動ページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    pageList.splice(
        target - 1,
        0,
        ...selected
    );

    render();

}

function undo(){

    if(historyStack.length===0){

        return;

    }

    pageList =
        historyStack.pop();

    render();

}

async function exportPdf(){

    setStatus('PDF生成中...');

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        if(p.rotation !== 0){

            page.setRotation(

                PDFLib.degrees(
                    p.rotation
                )

            );

        }

        newPdf.addPage(page);

    }

    const blob =
        new Blob(

            [await newPdf.save()],

            {
                type:'application/pdf'
            }

        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download='edited.pdf';

    a.click();

    setStatus('保存完了');

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '抽出ページを選択してください'
        );

        return;

    }

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        if(p.rotation !== 0){

            page.setRotation(

                PDFLib.degrees(
                    p.rotation
                )

            );

        }

        newPdf.addPage(page);

    }

    const blob =
        new Blob(

            [await newPdf.save()],

            {
                type:'application/pdf'
            }

        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download='selected.pdf';

    a.click();

}

new Sortable(pagesContainer,{

    animation:180,

    onEnd:(evt)=>{

        saveHistory();

        const moved =
            pageList.splice(
                evt.oldIndex,
                1
            )[0];

        pageList.splice(
            evt.newIndex,
            0,
            moved
        );

        render();

    }

});

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='a'
        ){

            e.preventDefault();

            pageList.forEach(
                p=>p.selected=true
            );

            updateSelectionUI();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='z'
        ){

            e.preventDefault();

            undo();

        }

        if(e.key==='Delete'){

            deleteSelected();

        }

        if(e.key==='Escape'){

            clearSelection();

        }

    }
);

</script>

</body>
</html>
