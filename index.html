<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - Debug Mode</title>
<!-- 信頼性の高いCDNから読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
    body { background: #111; color: #eee; padding: 20px; font-family: sans-serif; }
    #pages { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .page { border: 1px solid #555; padding: 5px; text-align: center; }
</style>
</head>
<body>

<h3>PDF Loader</h3>
<input type="file" id="fileInput" accept="application/pdf">
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        console.log("ファイルサイズ:", file.size);

        try {
            // 1. ArrayBufferを取得
            const arrayBuffer = await file.arrayBuffer();
            console.log("ArrayBuffer取得完了");

            // 2. PDFLibでロード（ここが一番エラーになりやすい箇所です）
            // Uint8Arrayに変換して明示的に渡す
            const uint8Array = new Uint8Array(arrayBuffer);
            const pdfDoc = await PDFLib.PDFDocument.load(uint8Array, { updateMetadata: false });
            console.log("PDFLibロード成功:", pdfDoc.getPageCount() + "ページ");

            // 3. PDF.jsでプレビュー
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            console.log("PDF.jsロード成功");

            render(pdf);
        } catch (err) {
            console.error("詳細エラー:", err);
            alert("読み込み失敗: " + err.message + "\n※ブラウザのコンソール(F12)も確認してください");
        }
    });

    async function render(pdf) {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const canvas = document.createElement('canvas');
            canvas.className = 'page';
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
        }
    }
</script>
</body>
</html>
