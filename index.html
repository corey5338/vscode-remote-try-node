<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Simple</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; }
    canvas { width: 100%; height: auto; background: white; border-radius: 4px; }
    button { cursor: pointer; padding: 8px 15px; border-radius: 4px; border: none; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="exportPdf()" style="background:#10b981">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pages = []; // {bytes: Uint8Array}

    async function loadPdf(file) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pdfDoc = await PDFLib.PDFDocument.load(bytes);
        const count = pdfDoc.getPageCount();
        
        for (let i = 0; i < count; i++) {
            const newDoc = await PDFLib.PDFDocument.create();
            const [page] = await newDoc.copyPages(pdfDoc, [i]);
            newDoc.addPage(page);
            pages.push({ bytes: await newDoc.save() });
        }
        render();
    }

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        
        for (let i = 0; i < pages.length; i++) {
            const div = document.createElement('div');
            div.className = 'page-item';
            const canvas = document.createElement('canvas');
            div.appendChild(canvas);
            container.appendChild(div);

            // PDF.jsで個別に描画
            const loadingTask = pdfjsLib.getDocument({ data: pages[i].bytes });
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            
            // サイズを固定せず、ページ本来の比率を維持する
            const scale = 0.5;
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        }
    }

    async function exportPdf() {
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(p.bytes);
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()]));
        a.download = "output.pdf";
        a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdf(e.target.files[0]));
</script>
</body>
</html>
