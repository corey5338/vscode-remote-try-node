<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
    .toolbar { background: var(--card); padding: 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    button, .file-label { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    input[type="file"] { display: none; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 25px; }
    .page { background: var(--card); border-radius: 8px; padding: 10px; border: 3px solid transparent; text-align: center; cursor: grab; }
    .page.selected { border-color: var(--accent); }
    canvas { width: 100%; border-radius: 4px; background: white; pointer-events: none; }
    .page-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; color: #94a3b8; font-size: 12px; }
    .move-btn { background: #475569; padding: 2px 8px; border-radius: 4px; cursor: pointer; color: white; }
    #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; }
</style>
</head>
<body>

<div id="loader"><div>処理中...</div></div>
<div class="toolbar">
    <label class="file-label">新規読み込み<input type="file" id="fileInput" accept="application/pdf"></label>
    <label class="file-label" style="background:#64748b">PDF追加<input type="file" id="addInput" accept="application/pdf"></label>
    <button onclick="undo()" style="background:#8b5cf6">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pagesData = []; 
    let history = [];
    const loader = document.getElementById('loader');

    // 履歴保存：CanvasはDOMなので保存対象から外す
    function saveState() { 
        history.push(JSON.stringify(pagesData.map(p => ({pdfBytes: p.pdfBytes})))); 
    }

    async function undo() { 
        if(history.length === 0) return;
        loader.style.display = 'flex';
        const state = JSON.parse(history.pop());
        const restored = [];
        for(let item of state) {
            restored.push({ pdfBytes: item.pdfBytes, canvas: await renderCanvas(item.pdfBytes), selected: false });
        }
        pagesData = restored; 
        render(); 
        loader.style.display = 'none';
    }

    async function renderCanvas(bytes) {
        const pdfjsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await pdfjsDoc.getPage(1);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const vp = page.getViewport({ scale: 0.3 });
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        return canvas;
    }

    async function loadPdfFile(file, isAppend = false) {
        loader.style.display = 'flex';
        saveState();
        try {
            const arrayBuffer = await file.arrayBuffer();
            const sourceDoc = await PDFLib.PDFDocument.load(new Uint8Array(arrayBuffer));
            let insertPos = isAppend ? parseInt(prompt(`挿入位置 (0-${pagesData.length}):`, pagesData.length)) : pagesData.length;
            if (isNaN(insertPos)) insertPos = pagesData.length;

            const newPages = [];
            for (let i = 0; i < sourceDoc.getPageCount(); i++) {
                const tempDoc = await PDFLib.PDFDocument.create();
                const [copiedPage] = await tempDoc.copyPages(sourceDoc, [i]);
                tempDoc.addPage(copiedPage);
                const bytes = await tempDoc.save();
                newPages.push({ pdfBytes: bytes, canvas: await renderCanvas(bytes), selected: false });
            }
            pagesData.splice(insertPos, 0, ...newPages);
            render();
        } catch(e) { alert("エラー: " + e.message); }
        loader.style.display = 'none';
    }

    function render() {
        const pagesEl = document.getElementById('pages');
        pagesEl.innerHTML = '';
        pagesData.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `page ${p.selected ? 'selected' : ''}`;
            div.onclick = (e) => { 
                if(e.target.tagName !== 'SPAN') { 
                    p.selected = !p.selected; 
                    div.classList.toggle('selected', p.selected);
                }
            };
            // Canvasを毎回クローンではなく、保持しているCanvasをDOMに追加
            div.appendChild(p.canvas);
            
            const controls = document.createElement('div');
            controls.className = 'page-controls';
            controls.innerHTML = `<span>P.${i+1}</span><span class="move-btn" onclick="movePage(${i})">移動</span>`;
            div.appendChild(controls);
            pagesEl.appendChild(div);
        });
    }

    function movePage(idx) {
        const target = prompt("移動先:", idx + 1);
        if(target && target > 0 && target <= pagesData.length) {
            saveState();
            const item = pagesData.splice(idx, 1)[0];
            pagesData.splice(target-1, 0, item);
            render();
        }
    }

    // Sortableの並び替え完了後に、pagesDataをDOMの順序と同期させる
    new Sortable(document.getElementById('pages'), {
        onStart: saveState,
        onEnd: () => {
            const newOrder = [];
            document.querySelectorAll('.page').forEach(div => {
                const canvas = div.querySelector('canvas');
                // DOM上のCanvasに対応するデータを特定する
                const p = pagesData.find(item => item.canvas === canvas);
                if(p) newOrder.push(p);
            });
            pagesData = newOrder;
            render();
        }
    });

    function deleteSelected() { saveState(); pagesData = pagesData.filter(p => !p.selected); render(); }

    async function exportPdf() {
        const outDoc = await PDFLib.PDFDocument.create();
        for (const p of pagesData) {
            const doc = await PDFLib.PDFDocument.load(p.pdfBytes);
            const [page] = await outDoc.copyPages(doc, [0]);
            outDoc.addPage(page);
        }
        const bytes = await outDoc.save();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        a.download = prompt("ファイル名", "edited.pdf") || "edited.pdf";
        a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdfFile(e.target.files[0], false));
    document.getElementById('addInput').addEventListener('change', (e) => loadPdfFile(e.target.files[0], true));
</script>
</body>
</html>
