<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro (Undo Ready)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #1e293b; color: white; padding: 20px; font-family: sans-serif; }
    .toolbar { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    #status { font-weight: bold; color: #fbbf24; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .page-item { background: #475569; padding: 5px; border-radius: 4px; cursor: move; border: 3px solid transparent; text-align: center; }
    .page-item.selected { border-color: #3b82f6; }
    canvas { width: 100%; pointer-events: none; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="addPdf()">PDF追加</button>
    <button onclick="undo()">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444; border:none; color:white; padding:5px 10px; cursor:pointer;">削除</button>
    <button onclick="exportPdf()" style="background:#10b981; border:none; color:white; padding:5px 10px; cursor:pointer;">保存</button>
    <div id="status"></div>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pageList = []; 
    let historyStack = []; // ページ構成の履歴（インデックスの配列のみを保存）

    const statusEl = document.getElementById('status');

    function saveHistory() {
        // 現在のpageListのクローン（中身は参照のコピー）を作成して履歴に積む
        historyStack.push([...pageList]);
    }

    // Sortable初期化
    new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: () => {
            saveHistory();
            const container = document.getElementById('pages');
            const newOrder = Array.from(container.children).map(div => parseInt(div.dataset.index));
            pageList = newOrder.map(i => pageList[i]);
            render();
        }
    });

    async function processFile(file, isReset) {
        statusEl.textContent = "読み込み中...";
        if (isReset) { pageList = []; historyStack = []; }
        
        try {
            const pdfDoc = await PDFLib.PDFDocument.load(new Uint8Array(await file.arrayBuffer()));
            const count = pdfDoc.getPageCount();

            for (let i = 0; i < count; i++) {
                statusEl.textContent = `ページ処理: ${i + 1} / ${count}`;
                const tempDoc = await PDFLib.PDFDocument.create();
                const [p] = await tempDoc.copyPages(pdfDoc, [i]);
                tempDoc.addPage(p);
                const thumb = await generateThumb(new Blob([await tempDoc.save()], {type: 'application/pdf'}));
                pageList.push({ doc: pdfDoc, pageIndex: i, thumb });
            }
            render();
            statusEl.textContent = "読み込み完了";
        } catch (e) {
            statusEl.textContent = "読み込みエラー";
        }
    }

    document.getElementById('fileInput').onchange = (e) => processFile(e.target.files[0], true);

    async function addPdf() {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'application/pdf';
        input.onchange = (e) => processFile(e.target.files[0], false);
        input.click();
    }

    function undo() {
        if (historyStack.length === 0) {
            alert("これ以上戻せません。");
            return;
        }
        pageList = historyStack.pop();
        render();
        statusEl.textContent = "Undoを実行しました";
    }

    function deleteSelected() {
        saveHistory(); // 削除前に履歴保存
        const container = document.getElementById('pages');
        const selected = Array.from(container.children).map(d => d.classList.contains('selected'));
        pageList = pageList.filter((_, i) => !selected[i]);
        render();
    }

    // (以下、generateThumb, render, exportPdf は前回同様のものを使用)
    async function generateThumb(blob) {
        const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.createElement('canvas');
        const vp = page.getViewport({ scale: 0.15 });
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        return canvas.toDataURL('image/webp', 0.4);
    }

    function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        pageList.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'page-item';
            div.dataset.index = i;
            div.innerHTML = `<img src="${p.thumb}"><div>${i + 1}</div>`;
            div.onclick = () => div.classList.toggle('selected');
            container.appendChild(div);
        });
    }

    async function exportPdf() {
        const name = prompt("ファイル名:", "edited.pdf");
        if (!name) return;
        const newPdf = await PDFLib.PDFDocument.create();
        for (let p of pageList) {
            const [page] = await newPdf.copyPages(p.doc, [p.pageIndex]);
            newPdf.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await newPdf.save()], {type: 'application/pdf'}));
        a.download = name; a.click();
    }
</script>
</body>
</html>
