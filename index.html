<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>

<!-- PDF.js, pdf-lib, SortableJS の読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
    body {
        margin: 0;
        background: #111827;
        color: white;
        font-family: sans-serif;
    }

    .toolbar {
        position: sticky;
        top: 0;
        z-index: 9999;
        background: #1f2937;
        padding: 10px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        border-bottom: 1px solid #374151;
    }

    button, .btn-file {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        display: inline-block;
    }

    button:hover, .btn-file:hover {
        background: #1d4ed8;
    }

    .danger { background: #dc2626; }
    .danger:hover { background: #b91c1c; }
    .secondary { background: #4b5563; }
    .secondary:hover { background: #374151; }

    input[type="file"] {
        display: none;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        padding: 20px;
    }

    .page {
        background: #1f2937;
        border-radius: 12px;
        overflow: hidden;
        border: 3px solid transparent;
        cursor: pointer;
        transition: border-color 0.2s, background-color 0.2s;
        user-select: none;
    }

    .page:hover {
        border-color: #60a5fa;
    }

    .page.selected {
        border-color: #3b82f6;
        background: #1e3a8a;
    }

    .page-header {
        background: rgba(0,0,0,0.2);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
    }

    .page-body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .page-body img {
        width: 100%;
        background: white;
        border-radius: 4px;
        min-height: 140px;
        object-fit: contain;
        pointer-events: none; /* ドラッグ時の誤作動防止 */
    }

    .bookmark-input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #4b5563;
        background: #374151;
        color: white;
    }
    
    .bookmark-input:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
    }
</style>
</head>

<body>

<div class="toolbar">
    <label class="btn-file">
        新規読み込み
        <input type="file" id="fileInput" accept="application/pdf">
    </label>
    <label class="btn-file">
        PDF追加
        <input type="file" id="addInput" accept="application/pdf">
    </label>

    <button class="secondary" onclick="undo()">元に戻す (Undo)</button>
    
    <div style="width: 2px; background: #4b5563; margin: 0 5px;"></div>

    <button onclick="selectAll()">全選択</button>
    <button onclick="clearSelection()">全解除</button>
    <button class="danger" onclick="deleteSelected()">削除</button>
    
    <div style="width: 2px; background: #4b5563; margin: 0 5px;"></div>

    <button onclick="exportPdf(true)">抽出保存</button>
    <button onclick="exportPdf(false)">保存 (名前を付けて保存)</button>
</div>

<div class="grid" id="pages"></div>

<script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    
    const { PDFDocument, PDFHexString } = PDFLib;

    // データ管理
    let fileSources = {}; // 高速化のため読み込んだPDFインスタンスをキャッシュ
    let pagesData = [];
    let stateHistory = [];
    let lastSelectedIndex = -1;

    const pagesEl = document.getElementById('pages');

    // グローバル関数として登録
    window.undo = undo;
    window.selectAll = selectAll;
    window.clearSelection = clearSelection;
    window.deleteSelected = deleteSelected;
    window.exportPdf = exportPdf;

    // 履歴管理
    function saveHistory() {
        stateHistory.push(JSON.parse(JSON.stringify(pagesData)));
        if (stateHistory.length > 30) stateHistory.shift(); // 最大30回まで
    }

    function undo() {
        if (stateHistory.length > 0) {
            pagesData = stateHistory.pop();
            renderPages();
        } else {
            alert('これ以上元に戻せません。');
        }
    }

    // ファイル読み込み処理
    document.getElementById('fileInput').addEventListener('change', (e) => handleFileLoad(e, false));
    document.getElementById('addInput').addEventListener('change', (e) => handleFileLoad(e, true));

    async function handleFileLoad(e, isAdd) {
        const file = e.target.files[0];
        if (!file) return;

        if (isAdd) saveHistory();

        const bytes = await file.arrayBuffer();
        const sourceId = crypto.randomUUID();

        // PDF.js(プレビュー用) と PDF-lib(編集・保存用) をキャッシュ
        const pdfjsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
        const pdflibDoc = await PDFDocument.load(bytes);
        fileSources[sourceId] = { pdfjsDoc, pdflibDoc };

        const pageCount = pdflibDoc.getPageCount();

        if (!isAdd) {
            pagesData = [];
            stateHistory = [];
        }

        for (let i = 0; i < pageCount; i++) {
            pagesData.push({
                id: crypto.randomUUID(),
                sourceId: sourceId,
                sourcePageIndex: i,
                selected: false,
                bookmark: '',
                thumbnailUrl: null
            });
        }

        renderPages();
        generateThumbnails(sourceId); // 非同期でサムネイル生成
        e.target.value = ''; // 連続で同じファイルを読み込めるようにリセット
    }

    // サムネイル画像の非同期生成 (大幅な高速化)
    async function generateThumbnails(sourceId) {
        const src = fileSources[sourceId];
        if (!src) return;
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        for (let p of pagesData) {
            if (p.sourceId === sourceId && !p.thumbnailUrl) {
                const page = await src.pdfjsDoc.getPage(p.sourcePageIndex + 1);
                const viewport = page.getViewport({ scale: 0.3 }); // サムネイル用縮小
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: context, viewport }).promise;
                
                p.thumbnailUrl = canvas.toDataURL();
                
                const imgEl = document.getElementById(`thumb-${p.id}`);
                if (imgEl) imgEl.src = p.thumbnailUrl;
            }
        }
    }

    // UIの描画
    function renderPages() {
        pagesEl.innerHTML = '';

        pagesData.forEach((p, index) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page' + (p.selected ? ' selected' : '');
            pageDiv.dataset.id = p.id;

            // ページクリックでの選択トグル (入力欄クリック時は除外)
            pageDiv.onclick = (e) => {
                if (e.target.tagName === 'INPUT') return;
                handlePageClick(e, index);
            };

            const header = document.createElement('div');
            header.className = 'page-header';
            header.innerHTML = `<span>Page ${index + 1}</span>`;

            const body = document.createElement('div');
            body.className = 'page-body';

            const img = document.createElement('img');
            img.id = `thumb-${p.id}`;
            if (p.thumbnailUrl) img.src = p.thumbnailUrl;

            const bkmkInput = document.createElement('input');
            bkmkInput.className = 'bookmark-input';
            bkmkInput.type = 'text';
            bkmkInput.placeholder = 'しおり名を追加...';
            bkmkInput.value = p.bookmark;
            
            // しおり編集時
            bkmkInput.onchange = (e) => {
                saveHistory();
                p.bookmark = e.target.value;
            };

            body.appendChild(img);
            body.appendChild(bkmkInput);
            
            pageDiv.appendChild(header);
            pageDiv.appendChild(body);
            pagesEl.appendChild(pageDiv);
        });

        // ドラッグ＆ドロップの有効化
        Sortable.create(pagesEl, {
            animation: 150,
            delay: 100,
            delayOnTouchOnly: true,
            onStart: () => saveHistory(),
            onEnd: (evt) => {
                const moved = pagesData.splice(evt.oldIndex, 1)[0];
                pagesData.splice(evt.newIndex, 0, moved);
                renderPages(); // 並び順が変わったのでページ番号更新のため再描画
            }
        });
    }

    // 選択の処理 (Shiftキー対応)
    function handlePageClick(e, index) {
        if (e.shiftKey && lastSelectedIndex !== -1) {
            const start = Math.min(lastSelectedIndex, index);
            const end = Math.max(lastSelectedIndex, index);
            for (let i = start; i <= end; i++) {
                pagesData[i].selected = true;
            }
        } else {
            pagesData[index].selected = !pagesData[index].selected;
            if (pagesData[index].selected) lastSelectedIndex = index;
        }
        updateSelectionUI();
    }

    // 選択状態の見た目だけを更新（再描画コスト削減）
    function updateSelectionUI() {
        const pageDivs = pagesEl.getElementsByClassName('page');
        for (let i = 0; i < pagesData.length; i++) {
            if (pagesData[i].selected) {
                pageDivs[i].classList.add('selected');
            } else {
                pageDivs[i].classList.remove('selected');
            }
        }
    }

    function selectAll() {
        pagesData.forEach(p => p.selected = true);
        updateSelectionUI();
    }

    function clearSelection() {
        pagesData.forEach(p => p.selected = false);
        updateSelectionUI();
        lastSelectedIndex = -1;
    }

    function deleteSelected() {
        if (!pagesData.some(p => p.selected)) return;
        saveHistory();
        pagesData = pagesData.filter(p => !p.selected);
        renderPages();
    }

    // PDFの保存・抽出処理
    async function exportPdf(isExtract) {
        const targetPages = isExtract ? pagesData.filter(p => p.selected) : pagesData;

        if (targetPages.length === 0) {
            alert('対象のページがありません。');
            return;
        }

        const defaultName = isExtract ? 'extracted.pdf' : 'edited.pdf';
        const fileName = prompt('保存するファイル名を入力してください:', defaultName);
        if (!fileName) return; // キャンセル時

        const newPdf = await PDFDocument.create();
        const bookmarks = [];

        // ページのコピーと追加
        for (const p of targetPages) {
            const srcDoc = fileSources[p.sourceId].pdflibDoc;
            const [copiedPage] = await newPdf.copyPages(srcDoc, [p.sourcePageIndex]);
            newPdf.addPage(copiedPage);

            if (p.bookmark && p.bookmark.trim() !== '') {
                bookmarks.push({
                    title: p.bookmark.trim(),
                    pageRef: copiedPage.ref
                });
            }
        }

        // しおり(アウトライン)の追加
        if (bookmarks.length > 0) {
            addBookmarks(newPdf, bookmarks);
        }

        const pdfBytes = await newPdf.save();
        downloadPdf(pdfBytes, fileName.endsWith('.pdf') ? fileName : fileName + '.pdf');
    }

    // PDFにしおりを埋め込む関数
    function addBookmarks(pdfDoc, bookmarks) {
        const context = pdfDoc.context;
        const outlinesDictRef = context.nextRef();
        const outlineItemRefs = bookmarks.map(() => context.nextRef());

        const outlinesDict = context.obj({
            Type: 'Outlines',
            First: outlineItemRefs[0],
            Last: outlineItemRefs[outlineItemRefs.length - 1],
            Count: outlineItemRefs.length,
        });
        context.assign(outlinesDictRef, outlinesDict);

        bookmarks.forEach((bm, i) => {
            const destArray = context.obj([bm.pageRef, context.name('Fit')]);
            const itemDict = {
                Title: PDFHexString.fromText(bm.title), // 日本語対応エンコーディング
                Parent: outlinesDictRef,
                Dest: destArray,
            };
            if (i > 0) itemDict.Prev = outlineItemRefs[i - 1];
            if (i < bookmarks.length - 1) itemDict.Next = outlineItemRefs[i + 1];

            context.assign(outlineItemRefs[i], context.obj(itemDict));
        });

        pdfDoc.catalog.set(context.name('Outlines'), outlinesDictRef);
    }

    function downloadPdf(bytes, fileName) {
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
