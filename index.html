<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Architect Pro Phase6</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#020617;
    --panel:#1e293b;
    --panel2:#334155;
    --accent:#3b82f6;
    --accent2:#60a5fa;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    background:
        radial-gradient(circle at top left,#1e293b 0%,#020617 45%),
        #020617;

    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;
}

.toolbar{

    position:sticky;
    top:16px;
    z-index:100;

    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;

    padding:16px 20px;

    border-radius:18px;

    background:rgba(15,23,42,.92);

    backdrop-filter:blur(12px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);

}

button{

    border:none;

    color:white;

    background:var(--panel2);

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    transition:.15s;

    font-weight:600;

}

button:hover{

    transform:translateY(-1px);

    background:#475569;

}

button.primary{

    background:var(--accent);

}

button.primary:hover{

    background:var(--accent2);

}

button.danger{

    background:var(--danger);

}

input.number-input{

    width:90px;

    padding:10px;

    border:none;

    border-radius:10px;

    background:#0f172a;

    color:white;

}

#status{

    margin-left:auto;

    color:var(--muted);

    font-size:.9rem;

}

#pages{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:18px;

    margin-top:22px;

}

.page-item{

    position:relative;

    background:rgba(30,41,59,.92);

    border:2px solid transparent;

    border-radius:16px;

    padding:12px;

    overflow:hidden;

    cursor:move;

    transition:.12s;

    box-shadow:
        0 8px 24px rgba(0,0,0,.25);

}

.page-item:hover{

    transform:translateY(-3px);

    border-color:#64748b;

}

.page-item.selected{

    border-color:var(--accent);

    background:#1e3a8a;

}

.preview-wrap{

    position:relative;

    aspect-ratio:0.7;

    border-radius:10px;

    overflow:hidden;

    background:#0f172a;

}

.preview-wrap img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

}

.loading{

    position:absolute;
    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(15,23,42,.5);

    color:#cbd5e1;

    font-size:.85rem;

}

.page-num{

    margin-top:10px;

    text-align:center;

    color:#cbd5e1;

    font-size:.85rem;

}

.empty{

    margin-top:40px;

    padding:50px;

    border-radius:20px;

    background:rgba(30,41,59,.45);

    text-align:center;

    color:#94a3b8;

}

</style>
</head>
<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="openFileDialog()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <input
        id="insertPageInput"
        class="number-input"
        type="number"
        min="1"
        placeholder="追加位置"
    >

    <button onclick="moveSelectedPages()">
        選択ページ移動
    </button>

    <input
        id="movePageInput"
        class="number-input"
        type="number"
        min="1"
        placeholder="移動先"
    >

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        onclick="exportSelected()"
        style="background:#8b5cf6;"
    >
        抽出保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

let renderVersion = 0;

const renderQueue = [];

const MAX_HISTORY = 10;

const MAX_RENDERERS = 2;

let activeRenderers = 0;

let observer;

function setStatus(text){

    document
        .getElementById('status')
        .textContent = text;

}

function bumpRenderVersion(){

    renderVersion++;

}

function cleanupMemory(){

    if(historyStack.length > MAX_HISTORY){

        historyStack.shift();

    }

}

function saveHistory(){

    historyStack.push(

        pageList.map(p => ({

            id:p.id,

            pageIndex:p.pageIndex,

            selected:p.selected,

            thumb:p.thumb,

            pdfBytes:p.pdfBytes,

            doc:p.doc

        }))

    );

    cleanupMemory();

}

function openFileDialog(){

    document
        .getElementById('fileInput')
        .click();

}

document
.getElementById('fileInput')
.onchange = e => {

    const file = e.target.files[0];

    if(file){

        processFile(file,true);

    }

};

async function processFile(file,isReset){

    try{

        bumpRenderVersion();

        renderQueue.length = 0;

        if(isReset){

            pageList = [];

            historyStack = [];

            pagesContainer.innerHTML='';

        }

        setStatus('PDF読み込み中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const total =
            pdfDoc.getPageCount();

        for(let i = 0; i < total; i++){

            pageList.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                thumb:null,

                rendering:false

            });

        }

        render();

        setStatus(
            `${total}ページ読み込み`
        );

    }catch(e){

        console.error(e);

        setStatus('エラー');

    }

}

async function addPdf(){

    const input =
        document.createElement('input');

    input.type='file';

    input.accept='application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        bumpRenderVersion();

        renderQueue.length = 0;

        saveHistory();

        setStatus('PDF追加中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const total =
            pdfDoc.getPageCount();

        let insertPos =
            Number(
                document.getElementById(
                    'insertPageInput'
                ).value
            ) - 1;

        if(
            isNaN(insertPos) ||
            insertPos < 0
        ){

            insertPos =
                pageList.findLastIndex(
                    p=>p.selected
                ) + 1;

        }

        if(insertPos < 0){

            insertPos = pageList.length;

        }

        const newPages = [];

        for(let i = 0; i < total; i++){

            newPages.push({

                id:crypto.randomUUID(),

                doc:pdfDoc,

                pdfBytes,

                pageIndex:i,

                selected:false,

                thumb:null,

                rendering:false

            });

        }

        pageList.splice(
            insertPos,
            0,
            ...newPages
        );

        render();

        setStatus(
            `${total}ページ追加`
        );

    };

    input.click();

}

function render(){

    if(observer){

        observer.disconnect();

    }

    if(pageList.length===0){

        pagesContainer.innerHTML = `

            <div class="empty">

                <h2>
                    PDFを読み込んでください
                </h2>

                <p>
                    上のボタンからPDFを選択してください
                </p>

            </div>

        `;

        return;

    }

    pagesContainer.innerHTML='';

    const fragment =
        document.createDocumentFragment();

    pageList.forEach((p,index)=>{

        const div =
            document.createElement('div');

        div.className='page-item';

        div.dataset.index=index;

        if(p.selected){

            div.classList.add('selected');

        }

        div.innerHTML=`

            <div class="preview-wrap">

                ${
                    p.thumb
                    ?
                    `<img src="${p.thumb}">`
                    :
                    `<div class="loading">
                        Loading...
                    </div>`
                }

            </div>

            <div class="page-num">
                Page ${index + 1}
            </div>

        `;

        div.onclick = e => {

            const idx =
                Number(div.dataset.index);

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(
                        idx,
                        lastSelectedIndex
                    );

                const end =
                    Math.max(
                        idx,
                        lastSelectedIndex
                    );

                for(let i=start;i<=end;i++){

                    pageList[i].selected=true;

                }

            }else{

                pageList[idx].selected =
                    !pageList[idx].selected;

            }

            lastSelectedIndex = idx;

            updateSelectionUI();

        };

        fragment.appendChild(div);

    });

    pagesContainer.appendChild(fragment);

    setupIntersectionObserver();

}

function setupIntersectionObserver(){

    observer =
        new IntersectionObserver(

        entries => {

            entries.forEach(entry => {

                if(entry.isIntersecting){

                    const index =
                        Number(
                            entry.target.dataset.index
                        );

                    queueThumbnail(index);

                }

            });

        },

        {
            rootMargin:'400px'
        }

    );

    Array.from(
        pagesContainer.children
    ).forEach(div => {

        observer.observe(div);

    });

}

function queueThumbnail(index){

    const p = pageList[index];

    if(!p) return;

    if(p.thumb) return;

    if(p.rendering) return;

    renderQueue.push({

        index,

        version:renderVersion

    });

    processRenderQueue();

}

function processRenderQueue(){

    while(

        activeRenderers < MAX_RENDERERS &&
        renderQueue.length > 0

    ){

        const item =
            renderQueue.shift();

        if(!item) return;

        activeRenderers++;

        generateThumbnail(
            item.index,
            item.version
        ).finally(()=>{

            activeRenderers--;

            processRenderQueue();

        });

    }

}

async function generateThumbnail(index,version){

    const p = pageList[index];

    if(!p) return;

    if(p.thumb) return;

    if(version !== renderVersion){

        return;

    }

    p.rendering = true;

    try{

        const loadingTask =
            pdfjsLib.getDocument({

                data:p.pdfBytes.slice(0)

            });

        const pdf =
            await loadingTask.promise;

        if(version !== renderVersion){

            loadingTask.destroy();

            return;

        }

        const page =
            await pdf.getPage(
                p.pageIndex + 1
            );

        const viewport =
            page.getViewport({
                scale:0.12
            });

        const canvas =
            document.createElement('canvas');

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha:false
                }
            );

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        await page.render({

            canvasContext:ctx,

            viewport

        }).promise;

        if(version !== renderVersion){

            return;

        }

        p.thumb =
            canvas.toDataURL(
                'image/webp',
                0.55
            );

        canvas.width = 1;
        canvas.height = 1;

        page.cleanup();

        pdf.cleanup();

        pdf.destroy();

        updateThumbnail(index);

    }catch(e){

        console.error(e);

    }finally{

        p.rendering = false;

    }

}

function updateThumbnail(index){

    const div =
        pagesContainer.children[index];

    if(!div) return;

    const p =
        pageList[index];

    if(!p) return;

    if(!p.thumb) return;

    const wrap =
        div.querySelector('.preview-wrap');

    if(!wrap) return;

    wrap.innerHTML = `

        <img src="${p.thumb}">

    `;

}

function updateSelectionUI(){

    Array.from(
        pagesContainer.children
    ).forEach((div,index)=>{

        div.classList.toggle(
            'selected',
            pageList[index].selected
        );

    });

}

function clearSelection(){

    pageList.forEach(
        p=>p.selected=false
    );

    updateSelectionUI();

}

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    bumpRenderVersion();

    renderQueue.length = 0;

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

    setStatus(
        `${selected.length}ページ削除`
    );

}

function moveSelectedPages(){

    const target =
        Number(
            document.getElementById(
                'movePageInput'
            ).value
        ) - 1;

    if(isNaN(target)){

        alert('移動先を入力してください');

        return;

    }

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert('移動ページを選択してください');

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    pageList.splice(
        target,
        0,
        ...selected
    );

    render();

    setStatus(
        `${selected.length}ページ移動`
    );

}

function undo(){

    if(historyStack.length===0){

        return;

    }

    bumpRenderVersion();

    renderQueue.length = 0;

    pageList =
        historyStack.pop();

    render();

    setStatus('Undo');

}

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    setStatus('PDF生成中...');

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('保存完了');

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){

        alert(
            '抽出ページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            'ファイル名',
            'selected.pdf'
        );

    if(!name) return;

    setStatus('抽出中...');

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

    setStatus('抽出完了');

}

new Sortable(pagesContainer,{

    animation:180,

    ghostClass:'selected',

    onEnd:(evt)=>{

        saveHistory();

        const moved =
            pageList.splice(
                evt.oldIndex,
                1
            )[0];

        pageList.splice(
            evt.newIndex,
            0,
            moved
        );

        render();

        setStatus('並び替え完了');

    }

});

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='a'
        ){

            e.preventDefault();

            pageList.forEach(
                p=>p.selected=true
            );

            updateSelectionUI();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='z'
        ){

            e.preventDefault();

            undo();

        }

        if(e.key==='Delete'){

            deleteSelected();

        }

        if(e.key==='Escape'){

            clearSelection();

        }

    }
);

</script>
</body>
</html>
