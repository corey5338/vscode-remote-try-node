<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Stable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; position: sticky; top: 0; z-index: 10; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 4px solid transparent; }
    .page-item.selected { border-color: #3b82f6; }
    canvas { width: 100%; pointer-events: none; background: white; border-radius: 4px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="undo()">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444">選択削除</button>
    <button onclick="exportPdf()" style="background:#10b981">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pages = []; 
    let history = [];

    // 修正: ArrayBufferそのものではなく、一度数値の配列にしてから保持することでメモリ解放の影響を回避
    function saveHistory() {
        history.push(pages.map(p => ({ 
            data: Array.from(p.bytes), 
            selected: p.selected 
        })));
    }

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for (let i = 0; i < pages.length; i++) {
            const p = pages[i];
            const div = document.createElement('div');
            div.className = 'page-item' + (p.selected ? ' selected' : '');
            div.onclick = () => { 
                p.selected = !p.selected; 
                div.classList.toggle('selected'); 
            };
            
            const canvas = document.createElement('canvas');
            div.appendChild(div); // 修正: div.appendChild(canvas)
            container.appendChild(div);
            div.appendChild(canvas);

            // Uint8Arrayに再変換して描画
            const bytes = new Uint8Array(p.bytes);
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
    }

    async function loadPdf(file) {
        saveHistory();
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
        for (let i = 0; i < pdf.getPageCount(); i++) {
            const doc = await PDFLib.PDFDocument.create();
            const [p] = await doc.copyPages(pdf, [i]);
            doc.addPage(p);
            pages.push({ bytes: await doc.save(), selected: false });
        }
        render();
    }

    function deleteSelected() {
        if (!pages.some(p => p.selected)) return;
        saveHistory();
        pages = pages.filter(p => !p.selected);
        render();
    }

    function undo() {
        if (history.length === 0) return;
        // 履歴から復元する際、ArrayをUint8Arrayに戻す
        const last = history.pop();
        pages = last.map(p => ({ bytes: new Uint8Array(p.data), selected: p.selected }));
        render();
    }

    new Sortable(document.getElementById('pages'), {
        onEnd: () => {
            saveHistory();
            render();
        }
    });

    async function exportPdf() {
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(p.bytes);
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
        a.download = "output.pdf";
        a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdf(e.target.files[0]));
</script>
</body>
</html>
