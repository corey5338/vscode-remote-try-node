<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Architect Pro Ultimate</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{

```
--bg:#020617;
--bg2:#0f172a;

--panel:rgba(15,23,42,.92);
--panel2:#1e293b;

--accent:#3b82f6;
--accent2:#60a5fa;

--danger:#ef4444;

--text:#f8fafc;
--muted:#94a3b8;

--border:rgba(255,255,255,.06);

--shadow:
    0 12px 40px rgba(0,0,0,.35);
```

}

*{
box-sizing:border-box;
}

body{

```
margin:0;

background:
    radial-gradient(circle at top left,#1e293b 0%,#020617 45%),
    linear-gradient(to bottom,#020617,#0f172a);

color:var(--text);

font-family:
    Inter,
    "Segoe UI",
    system-ui,
    sans-serif;

height:100vh;

overflow:hidden;
```

}

.app{

```
display:grid;

grid-template-columns:
    280px 1fr;

height:100vh;
```

}

.sidebar{

```
background:rgba(15,23,42,.95);

border-right:1px solid var(--border);

backdrop-filter:blur(20px);

display:flex;
flex-direction:column;

padding:20px;

gap:18px;

overflow:auto;
```

}

.app-title{

```
display:flex;
align-items:center;
gap:14px;

padding-bottom:16px;

border-bottom:1px solid var(--border);
```

}

.logo{

```
width:54px;
height:54px;

border-radius:18px;

background:
    linear-gradient(
        135deg,
        var(--accent),
        #2563eb
    );

display:flex;
align-items:center;
justify-content:center;

font-size:1.6rem;

box-shadow:
    0 12px 24px rgba(37,99,235,.35);
```

}

.title-text h1{

```
margin:0;

font-size:1.1rem;
```

}

.title-text p{

```
margin:4px 0 0;

color:var(--muted);

font-size:.8rem;
```

}

.side-section{

```
display:flex;
flex-direction:column;

gap:10px;
```

}

.side-label{

```
font-size:.78rem;

color:var(--muted);

text-transform:uppercase;

letter-spacing:.08em;

font-weight:700;
```

}

.side-card{

```
background:rgba(30,41,59,.7);

border:1px solid var(--border);

border-radius:18px;

padding:14px;

display:flex;
flex-direction:column;

gap:10px;
```

}

button{

```
border:none;

border-radius:14px;

padding:12px 16px;

cursor:pointer;

color:white;

background:#334155;

transition:
    transform .12s,
    background .12s;

font-weight:700;

font-size:.92rem;
```

}

button:hover{

```
transform:translateY(-2px);

background:#475569;
```

}

button.primary{

```
background:
    linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
```

}

button.danger{

```
background:
    linear-gradient(
        135deg,
        #ef4444,
        #dc2626
    );
```

}

.number-input{

```
width:100%;

padding:12px;

border:none;

border-radius:14px;

background:#0f172a;

color:white;

outline:none;

border:1px solid var(--border);
```

}

.main{

```
display:flex;
flex-direction:column;

overflow:hidden;
```

}

.titlebar{

```
height:64px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 22px;

background:rgba(15,23,42,.78);

backdrop-filter:blur(18px);

border-bottom:1px solid var(--border);
```

}

.window-buttons{

```
display:flex;
gap:10px;
```

}

.window-dot{

```
width:14px;
height:14px;

border-radius:999px;
```

}

.red{
background:#ef4444;
}

.yellow{
background:#f59e0b;
}

.green{
background:#22c55e;
}

.titlebar-right{

```
display:flex;
align-items:center;
gap:16px;
```

}

.status-pill{

```
background:rgba(30,41,59,.85);

border:1px solid var(--border);

padding:8px 14px;

border-radius:999px;

color:#cbd5e1;

font-size:.85rem;

font-weight:700;
```

}

.content{

```
flex:1;

overflow:auto;

padding:24px;
```

}

#pages{

```
display:grid;

grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));

gap:24px;
```

}

.page-item{

```
position:relative;

overflow:hidden;

border-radius:24px;

background:
    linear-gradient(
        180deg,
        rgba(30,41,59,.9),
        rgba(15,23,42,.92)
    );

border:2px solid transparent;

padding:14px;

cursor:move;

transition:
    transform .12s,
    border-color .12s;
```

}

.page-item:hover{

```
transform:translateY(-4px);

border-color:#64748b;
```

}

.page-item.selected{

```
border-color:var(--accent);

background:
    linear-gradient(
        180deg,
        rgba(37,99,235,.34),
        rgba(15,23,42,.95)
    );
```

}

.preview-wrap{

```
position:relative;

aspect-ratio:0.7;

overflow:hidden;

border-radius:18px;

background:#0f172a;

display:flex;
align-items:center;
justify-content:center;
```

}

.preview-wrap img{

```
width:100%;
height:100%;

object-fit:contain;

display:block;
```

}

.loading{

```
position:absolute;
inset:0;

display:flex;
align-items:center;
justify-content:center;

color:#cbd5e1;

font-size:.86rem;
```

}

.page-footer{

```
margin-top:14px;

display:flex;
justify-content:space-between;
align-items:center;
```

}

.page-num{

```
font-size:.95rem;

font-weight:700;
```

}

.page-meta{

```
color:var(--muted);

font-size:.76rem;
```

}

.badge{

```
position:absolute;
top:12px;
right:12px;

background:rgba(15,23,42,.82);

padding:6px 10px;

border-radius:999px;

font-size:.72rem;

font-weight:700;

color:#cbd5e1;
```

}

.rotate-badge{

```
position:absolute;
top:12px;
left:12px;

background:rgba(15,23,42,.82);

padding:6px 10px;

border-radius:999px;

font-size:.72rem;

font-weight:700;

color:#cbd5e1;
```

}

.empty{

```
margin-top:80px;

padding:80px;

border-radius:32px;

background:
    linear-gradient(
        180deg,
        rgba(30,41,59,.6),
        rgba(15,23,42,.75)
    );

border:1px solid var(--border);

text-align:center;

color:#94a3b8;
```

}

.statusbar{

```
height:42px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 18px;

background:rgba(15,23,42,.88);

border-top:1px solid var(--border);

color:#cbd5e1;

font-size:.82rem;
```

}

</style>
</head>
<body>

<div class="app">

```
<aside class="sidebar">

    <div class="app-title">

        <div class="logo">
            📄
        </div>

        <div class="title-text">

            <h1>
                PDF Architect
            </h1>

            <p>
                Ultimate Edition
            </p>

        </div>

    </div>

    <div class="side-section">

        <div class="side-label">
            PDF操作
        </div>

        <div class="side-card">

            <button
                class="primary"
                onclick="openFileDialog()"
            >
                新規読み込み
            </button>

            <button onclick="addPdf()">
                指定位置へ追加
            </button>

            <input
                id="insertPageInput"
                class="number-input"
                type="number"
                min="1"
                placeholder="追加位置"
            >

        </div>

    </div>

    <div class="side-section">

        <div class="side-label">
            ページ操作
        </div>

        <div class="side-card">

            <button onclick="moveSelectedPages()">
                選択ページ移動
            </button>

            <input
                id="movePageInput"
                class="number-input"
                type="number"
                min="1"
                placeholder="移動先"
            >

            <button onclick="rotateSelected(90)">
                ↻ 右回転
            </button>

            <button onclick="rotateSelected(-90)">
                ↺ 左回転
            </button>

            <button
                class="danger"
                onclick="deleteSelected()"
            >
                削除
            </button>

            <button onclick="clearSelection()">
                選択解除
            </button>

            <button onclick="undo()">
                Undo
            </button>

        </div>

    </div>

    <div class="side-section">

        <div class="side-label">
            保存
        </div>

        <div class="side-card">

            <button
                class="primary"
                onclick="exportSelected()"
                style="background:#8b5cf6;"
            >
                抽出保存
            </button>

            <button
                class="primary"
                onclick="exportPdf()"
            >
                全保存
            </button>

        </div>

    </div>

</aside>

<main class="main">

    <div class="titlebar">

        <div class="window-buttons">

            <div class="window-dot red"></div>
            <div class="window-dot yellow"></div>
            <div class="window-dot green"></div>

        </div>

        <div class="titlebar-right">

            <div class="status-pill">
                ローカル動作
            </div>

            <div class="status-pill">
                PDFセキュア
            </div>

        </div>

    </div>

    <div class="content">

        <input
            type="file"
            id="fileInput"
            hidden
            accept="application/pdf"
        >

        <div id="pages"></div>

    </div>

    <div class="statusbar">

        <div id="status">
            Ready
        </div>

        <div>
            最適化レンダリング有効
        </div>

    </div>

</main>
```

</div>

</body>
</html>
