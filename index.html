<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>

<!-- ライブラリ読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
    body { margin: 0; background: #111827; color: white; font-family: sans-serif; }
    .toolbar { position: sticky; top: 0; z-index: 9999; background: #1f2937; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #374151; }
    button, .btn-file { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1d4ed8; }
    .danger { background: #dc2626; }
    .secondary { background: #4b5563; }
    input[type="file"] { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; }
    .page { background: #1f2937; border-radius: 12px; border: 3px solid transparent; cursor: pointer; user-select: none; }
    .page.selected { border-color: #3b82f6; background: #1e3a8a; }
    .page-header { background: rgba(0,0,0,0.2); padding: 8px; font-weight: bold; }
    .page-body { padding: 10px; }
    .page-body img { width: 100%; background: white; border-radius: 4px; }
    .bookmark-input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 5px; background: #374151; color: white; border: 1px solid #4b5563; }
</style>
</head>
<body>

<div class="toolbar">
    <label class="btn-file">新規読み込み<input type="file" id="fileInput" accept="application/pdf"></label>
    <button class="secondary" onclick="undo()">元に戻す</button>
    <button onclick="deleteSelected()" class="danger">削除</button>
    <button onclick="exportPdf(false)">保存</button>
</div>
<div class="grid" id="pages"></div>

<script>
    // ワーカーを使わない設定（これでエラーを回避します）
    pdfjsLib.GlobalWorkerOptions.workerSrc = ''; 
    const { PDFDocument, PDFHexString } = PDFLib;

    let pagesData = [], fileSources = {}, stateHistory = [];

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const bytes = await file.arrayBuffer();
        const sourceId = Math.random().toString(36).substr(2, 9);
        
        // 読み込み
        const pdfjsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
        const pdflibDoc = await PDFDocument.load(bytes);
        fileSources[sourceId] = { pdfjsDoc, pdflibDoc };

        pagesData = [];
        for (let i = 0; i < pdflibDoc.getPageCount(); i++) {
            pagesData.push({ id: Math.random(), sourceId, sourcePageIndex: i, selected: false, bookmark: '', thumbnailUrl: '' });
        }
        renderPages();
        generateThumbnails(sourceId);
    });

    async function generateThumbnails(sourceId) {
        const src = fileSources[sourceId];
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        for (let p of pagesData) {
            const page = await src.pdfjsDoc.getPage(p.sourcePageIndex + 1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            p.thumbnailUrl = canvas.toDataURL();
            document.getElementById('img-' + p.id).src = p.thumbnailUrl;
        }
    }

    function renderPages() {
        const pagesEl = document.getElementById('pages');
        pagesEl.innerHTML = '';
        pagesData.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'page' + (p.selected ? ' selected' : '');
            div.onclick = () => { p.selected = !p.selected; div.className = 'page' + (p.selected ? ' selected' : ''); };
            div.innerHTML = `<div class="page-header">Page ${i + 1}</div><div class="page-body"><img id="img-${p.id}"><input class="bookmark-input" placeholder="しおり名" onchange="this.blur();"></div>`;
            pagesEl.appendChild(div);
        });
    }

    async function exportPdf(isExtract) {
        const newPdf = await PDFDocument.create();
        for (let p of pagesData) {
            const [copied] = await newPdf.copyPages(fileSources[p.sourceId].pdflibDoc, [p.sourcePageIndex]);
            newPdf.addPage(copied);
        }
        const bytes = await newPdf.save();
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'edited.pdf'; a.click();
    }
    
    function deleteSelected() { pagesData = pagesData.filter(p => !p.selected); renderPages(); }
    function undo() { alert("履歴機能はシンプル化のため一時停止中"); }
</script>
</body>
</html>
