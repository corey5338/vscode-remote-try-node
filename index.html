<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Simple</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; position: sticky; top: 0; background: #0f172a; padding: 10px 0; z-index: 10; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 4px solid transparent; }
    .page-item.selected { border-color: #3b82f6; }
    canvas { width: 100%; height: auto; background: white; border-radius: 4px; pointer-events: none; }
    button { cursor: pointer; padding: 8px 15px; border-radius: 4px; border: none; font-weight: bold; }
    .btn-del { background: #ef4444; color: white; }
    .btn-save { background: #10b981; color: white; }
    .btn-undo { background: #8b5cf6; color: white; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button class="btn-undo" onclick="undo()">Undo</button>
    <button class="btn-del" onclick="deleteSelected()">選択ページ削除</button>
    <button class="btn-save" onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pages = []; // {bytes: Uint8Array, selected: boolean}
    let history = [];

    // 安全な履歴保存用関数
    function saveHistory() {
        history.push(pages.map(p => ({ bytes: p.bytes.slice(), selected: p.selected })));
    }

    async function loadPdf(file) {
        saveHistory();
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pdfDoc = await PDFLib.PDFDocument.load(bytes);
        for (let i = 0; i < pdfDoc.getPageCount(); i++) {
            const newDoc = await PDFLib.PDFDocument.create();
            const [page] = await newDoc.copyPages(pdfDoc, [i]);
            newDoc.addPage(page);
            pages.push({ bytes: await newDoc.save(), selected: false });
        }
        render();
    }

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        
        for (let i = 0; i < pages.length; i++) {
            const div = document.createElement('div');
            div.className = 'page-item' + (pages[i].selected ? ' selected' : '');
            div.onclick = () => {
                pages[i].selected = !pages[i].selected;
                div.classList.toggle('selected');
            };

            const canvas = document.createElement('canvas');
            div.appendChild(canvas);
            container.appendChild(div);

            const pdf = await pdfjsLib.getDocument({ data: pages[i].bytes }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 0.3 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
    }

    function deleteSelected() {
        if (!pages.some(p => p.selected)) return alert("削除するページを選択してください");
        saveHistory();
        pages = pages.filter(p => !p.selected);
        render();
    }

    function undo() {
        if (history.length === 0) return alert("これ以上戻せません");
        pages = history.pop();
        render();
    }

    async function exportPdf() {
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(p.bytes);
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
        a.download = "edited.pdf";
        a.click();
    }

    new Sortable(document.getElementById('pages'), {
        onStart: () => saveHistory(),
        onEnd: (evt) => {
            const item = pages.splice(evt.oldIndex, 1)[0];
            pages.splice(evt.newIndex, 0, item);
            render();
        }
    });

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdf(e.target.files[0]));
</script>
</body>
</html>
