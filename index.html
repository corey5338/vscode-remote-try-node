<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - Final Stable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; cursor: pointer; border: 4px solid transparent; position: relative; }
    .page-item.selected { border-color: #3b82f6; }
    .page-number { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    img { width: 100%; pointer-events: none; border-radius: 4px; }
</style>
</head>
<body>
<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="document.getElementById('addInput').click()" style="background:#3b82f6">指定位置へ追加</button>
    <input type="file" id="addInput" accept="application/pdf" style="display:none">
    <button onclick="deleteSelected()" style="background:#ef4444">選択削除</button>
    <button onclick="exportPdf()" style="background:#10b981">名前を付けて保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pages = []; // {blob: Blob, thumb: string}

    async function addPages(file) {
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
        const newPages = [];
        
        for (let i = 0; i < pdf.getPageCount(); i++) {
            const doc = await PDFLib.PDFDocument.create();
            const [p] = await doc.copyPages(pdf, [i]);
            doc.addPage(p);
            const blob = new Blob([await doc.save()], {type: 'application/pdf'});
            const thumb = await generateThumbnail(blob);
            newPages.push({ blob, thumb });
        }

        // 挿入ロジック：選択ページがあればその前に、なければ末尾に
        const selectedIdx = pages.findIndex((p, i) => document.getElementById('pages').children[i].classList.contains('selected'));
        if (selectedIdx !== -1) pages.splice(selectedIdx, 0, ...newPages);
        else pages.push(...newPages);
        
        renderAll();
    }

    async function generateThumbnail(blob) {
        const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.createElement('canvas');
        const vp = page.getViewport({ scale: 0.2 });
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        return canvas.toDataURL('image/webp', 0.5);
    }

    function renderAll() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        pages.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'page-item';
            div.innerHTML = `<div class="page-number">${i + 1}</div><img src="${p.thumb}">`;
            div.onclick = () => div.classList.toggle('selected');
            container.appendChild(div);
        });
    }

    function deleteSelected() {
        const container = document.getElementById('pages');
        pages = pages.filter((_, i) => !container.children[i].classList.contains('selected'));
        renderAll();
    }

    new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: () => {
            // ドラッグ完了後にDOM順序を配列に同期
            const container = document.getElementById('pages');
            const newPages = [];
            Array.from(container.children).forEach(el => {
                const index = Array.from(container.children).indexOf(el);
                // 実際にはもっと単純に、今のDOMの並び順でpagesを並べ替える
            });
            // 修正: DOMの順番にpagesを並べ替える
            const ordered = Array.from(container.children).map(el => {
                const idx = Array.from(container.children).indexOf(el);
                return pages[idx]; // これだと元の配列からインデックスを参照してしまっている
            });
            // 正しい同期ロジック
            const nextPages = Array.from(container.children).map(el => {
                const originalIndex = [...container.children].indexOf(el);
                return pages[[...container.children].indexOf(el)]; // これも誤り
            });
            // シンプルに「Sortableが並び替えた後のDOM」からインデックスを特定する
            const next = [];
            Array.from(container.children).forEach((el, newIdx) => {
                // 各DOM要素が元々どのインデックスだったかを特定するのは困難なので
                // ドラッグ終了時は、Sortableで動かされた結果のDOMに基づいて再マップする
            });
            // 最も確実な同期：Sortable終了時に一回だけ再マッピング
            const reordered = [...container.children].map(el => {
                 const oldIdx = [...container.children].indexOf(el);
                 // これだとループ内で無限に取得してしまう
            });
            // 最終手段：SortableがDOMを直接いじった後、そのDOMからデータを再構築する
            // 全DOMにインデックスを保持させる
        }
    });

    // 最新の同期ロジック修正
    const sortable = new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: () => {
            const items = Array.from(document.getElementById('pages').children);
            const newPages = items.map(el => pages[Number(el.dataset.index)]);
            pages = newPages;
            renderAll(); // これを呼ばないとインデックスがズレる
        }
    });

    // renderAll内でインデックスを保持
    function renderAll() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        pages.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'page-item';
            div.dataset.index = i; // インデックスを保持
            div.innerHTML = `<div class="page-number">${i + 1}</div><img src="${p.thumb}">`;
            div.onclick = () => div.classList.toggle('selected');
            container.appendChild(div);
        });
    }

    async function exportPdf() {
        const name = prompt("ファイル名:", "edited.pdf");
        if (!name) return;
        const out = await PDFLib.PDFDocument.create();
        for (const p of pages) {
            const doc = await PDFLib.PDFDocument.load(await p.blob.arrayBuffer());
            const [page] = await out.copyPages(doc, [0]);
            out.addPage(page);
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
        a.download = name; a.click();
    }

    document.getElementById('fileInput').onchange = (e) => { pages = []; addPages(e.target.files[0]); };
    document.getElementById('addInput').onchange = (e) => addPages(e.target.files[0]);
</script>
</body>
</html>
