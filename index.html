<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - Buffered</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; padding: 20px; }
    #pages { display: flex; flex-wrap: wrap; gap: 10px; }
    .page-item { width: 120px; background: #334155; padding: 5px; border-radius: 4px; cursor: pointer; border: 3px solid transparent; }
    .page-item.selected { border-color: #3b82f6; }
    img { width: 100%; pointer-events: none; }
</style>
</head>
<body>
    <input type="file" id="fileInput">
    <div id="status"></div>
    <div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pages = [];

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const status = document.getElementById('status');
        const container = document.getElementById('pages');
        container.innerHTML = '';
        pages = [];

        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(new Uint8Array(arrayBuffer));
        const total = pdfDoc.getPageCount();

        // ページを1つずつ順次処理（メモリ負荷を低減）
        for (let i = 0; i < total; i++) {
            status.textContent = `読み込み中... ${i + 1} / ${total}`;
            
            const newDoc = await PDFLib.PDFDocument.create();
            const [copied] = await newDoc.copyPages(pdfDoc, [i]);
            newDoc.addPage(copied);
            const blob = new Blob([await newDoc.save()], {type: 'application/pdf'});
            
            // サムネイル生成
            const thumb = await generateThumb(blob);
            pages.push({ blob, thumb });

            // 画面に追加
            const div = document.createElement('div');
            div.className = 'page-item';
            div.innerHTML = `<img src="${thumb}"><div>${i + 1}</div>`;
            div.onclick = () => div.classList.toggle('selected');
            container.appendChild(div);
        }
        status.textContent = "読み込み完了";
    });

    async function generateThumb(blob) {
        const data = await blob.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.createElement('canvas');
        const vp = page.getViewport({ scale: 0.15 }); // 少し小さくして軽量化
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        return canvas.toDataURL('image/webp', 0.4); // 画質を下げてメモリ節約
    }
</script>
</body>
</html>
