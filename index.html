<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
    .toolbar { background: var(--card); padding: 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    button, .file-label { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .file-label { display: inline-block; cursor: pointer; }
    input[type="file"] { display: none; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 25px; }
    .page { background: var(--card); border-radius: 8px; padding: 10px; border: 3px solid transparent; cursor: grab; text-align: center; }
    .page.selected { border-color: var(--accent); }
    canvas { width: 100%; border-radius: 4px; pointer-events: none; background: white; }
    .page-label { margin-top: 8px; font-size: 13px; font-weight: bold; color: #94a3b8; }
    #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>処理中...</p></div>

<div class="toolbar">
    <label class="file-label">新規読み込み<input type="file" id="fileInput" accept="application/pdf"></label>
    <label class="file-label" style="background:#64748b">PDF追加<input type="file" id="addInput" accept="application/pdf"></label>
    <button onclick="undo()" style="background:#8b5cf6">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let originalPdfDoc = null; 
    let pagesData = []; 
    let history = []; 
    const loader = document.getElementById('loader');

    function saveState() {
        // 現在の状態を履歴に保存（深層コピー）
        history.push(JSON.stringify(pagesData.map(p => ({ originalIndex: p.originalIndex, selected: false }))));
        if (history.length > 20) history.shift();
    }

    function undo() {
        if (history.length === 0) return;
        const lastState = JSON.parse(history.pop());
        // 以前の state を反映して再レンダリングするロジックが必要
        alert("元に戻しました（ページデータの復元が必要です）");
    }

    async function loadPdfFile(file, isAppend = false) {
        loader.style.display = 'flex';
        saveState();
        try {
            const bytes = await file.arrayBuffer();
            const newDoc = await PDFLib.PDFDocument.load(new Uint8Array(bytes));
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

            if (!isAppend || !originalPdfDoc) {
                originalPdfDoc = newDoc;
                pagesData = [];
            } else {
                // PDFLib上のインデックスを管理するため、新しく追加したページを登録
                const offset = originalPdfDoc.getPageCount();
                for (let i = 0; i < newDoc.getPageCount(); i++) {
                    const [page] = await originalPdfDoc.copyPages(newDoc, [i]);
                    originalPdfDoc.addPage(page);
                }
            }

            for (let i = 0; i < pdf.numPages; i++) {
                const page = await pdf.getPage(i + 1);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const vp = page.getViewport({ scale: 0.3 });
                canvas.width = vp.width; canvas.height = vp.height;
                await page.render({ canvasContext: ctx, viewport: vp }).promise;
                pagesData.push({ originalIndex: (isAppend ? originalPdfDoc.getPageCount() - pdf.numPages : 0) + i, canvas, selected: false });
            }
            render();
        } catch (e) { alert("エラー: " + e.message); }
        loader.style.display = 'none';
    }

    function render() {
        const pagesEl = document.getElementById('pages');
        pagesEl.innerHTML = '';
        pagesData.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `page ${p.selected ? 'selected' : ''}`;
            div.onclick = () => { p.selected = !p.selected; div.className = `page ${p.selected ? 'selected' : ''}`; };
            div.appendChild(p.canvas);
            div.innerHTML += `<div class="page-label">P.${i + 1}</div>`;
            pagesEl.appendChild(div);
        });
    }

    new Sortable(document.getElementById('pages'), { animation: 150, onEnd: () => {
        saveState();
        // SortableによってDOM順が変わった後に、pagesDataの順序を同期する
        const children = [...document.getElementById('pages').children];
        const newPagesData = children.map((el, i) => {
            return pagesData.find((_, index) => document.getElementById('pages').children[i] === document.getElementById('pages').children[index]);
            // ※簡易的な同期のため、ドラッグ完了時に配列を再生成する実装を推奨
        });
    }});

    function deleteSelected() { saveState(); pagesData = pagesData.filter(p => !p.selected); render(); }

    async function exportPdf() {
        const finalPdf = await PDFLib.PDFDocument.create();
        for (const p of pagesData) {
            // ここがポイント: 常に「現在の並び順」に合わせて originalPdfDoc からページを抽出する
            const [page] = await finalPdf.copyPages(originalPdfDoc, [p.originalIndex]);
            finalPdf.addPage(page);
        }
        const bytes = await finalPdf.save();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        a.download = prompt("ファイル名", "edited.pdf") || "edited.pdf";
        a.click();
    }

    document.getElementById('fileInput').addEventListener('change', (e) => loadPdfFile(e.target.files[0], false));
    document.getElementById('addInput').addEventListener('change', (e) => loadPdfFile(e.target.files[0], true));
</script>
</body>
</html>
