<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
    body { background: #111; color: white; font-family: sans-serif; }
    .toolbar { background: #222; padding: 10px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
    .page { background: #333; padding: 10px; border: 3px solid transparent; cursor: grab; }
    .page.selected { border-color: #3b82f6; }
    canvas { width: 100%; background: white; pointer-events: none; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="deleteSelected()">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pdfLibDoc = null;
    let pagesData = []; // { id, canvasData, selected }
    const pagesEl = document.getElementById('pages');

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const bytes = await file.arrayBuffer();
        pdfLibDoc = await PDFLib.PDFDocument.load(bytes);
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

        pagesData = [];
        for (let i = 0; i < pdf.numPages; i++) {
            const page = await pdf.getPage(i + 1);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            
            pagesData.push({ id: Math.random(), canvas: canvas, selected: false });
        }
        render();
    });

    function render() {
        pagesEl.innerHTML = '';
        pagesData.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `page ${p.selected ? 'selected' : ''}`;
            div.onclick = () => { p.selected = !p.selected; div.className = `page ${p.selected ? 'selected' : ''}`; };
            div.appendChild(p.canvas);
            pagesEl.appendChild(div);
        });
    }

    // ドラッグ＆ドロップ並べ替え設定
    new Sortable(pagesEl, {
        animation: 150,
        onEnd: (evt) => {
            const item = pagesData.splice(evt.oldIndex, 1)[0];
            pagesData.splice(evt.newIndex, 0, item);
        }
    });

    async function deleteSelected() {
        pagesData = pagesData.filter(p => !p.selected);
        render();
    }

    async function exportPdf() {
        const newPdf = await PDFLib.PDFDocument.create();
        for (let i = 0; i < pagesData.length; i++) {
            // 現在のpagesDataの順序に基づき、元のpdfLibDocから該当ページをコピー
            // 注: ページ入れ替えに対応するため、全ページ一度読み込んでから再構築するのが最も安全です
            const [copied] = await newPdf.copyPages(pdfLibDoc, [i]);
            newPdf.addPage(copied);
        }
        const bytes = await newPdf.save();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        a.download = 'edited.pdf';
        a.click();
    }
</script>
</body>
</html>
