<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
    body { margin: 0; background: #111; color: white; font-family: sans-serif; }
    .toolbar { background: #222; padding: 10px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #444; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
    .page { background: #333; padding: 10px; border: 3px solid transparent; cursor: pointer; position: relative; }
    .page.selected { border-color: #3b82f6; }
    canvas { width: 100%; background: white; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="deleteSelected()">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pdfLibDoc = null;
    let pagesData = [];

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const bytes = await file.arrayBuffer();
        pdfLibDoc = await PDFLib.PDFDocument.load(bytes);
        
        pagesData = [];
        for (let i = 0; i < pdfLibDoc.getPageCount(); i++) {
            pagesData.push({ selected: false });
        }
        render();
    });

    async function render() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        
        for (let i = 0; i < pagesData.length; i++) {
            const div = document.createElement('div');
            div.className = `page ${pagesData[i].selected ? 'selected' : ''}`;
            div.innerHTML = `<canvas id="c${i}"></canvas>`;
            div.onclick = () => {
                pagesData[i].selected = !pagesData[i].selected;
                div.className = `page ${pagesData[i].selected ? 'selected' : ''}`;
            };
            container.appendChild(div);

            // 描画: pdfLibDocをPDFに変換して描画
            const bytes = await pdfLibDoc.save();
            const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
            const page = await pdf.getPage(i + 1);
            const canvas = document.getElementById('c' + i);
            const ctx = canvas.getContext('2d');
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
        }
    }

    async function deleteSelected() {
        if (!pdfLibDoc) return;
        
        // 後ろから削除しないとインデックスがずれるため、後ろから処理
        for (let i = pagesData.length - 1; i >= 0; i--) {
            if (pagesData[i].selected) {
                pdfLibDoc.removePage(i);
                pagesData.splice(i, 1);
            }
        }
        render();
    }

    async function exportPdf() {
        const bytes = await pdfLibDoc.save();
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'edited.pdf';
        a.click();
    }
</script>
</body>
</html>
