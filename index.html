<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor - High Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
    body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; position: sticky; top: 0; z-index: 10; padding: 10px 0; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .page-item { background: #334155; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 4px solid transparent; position: relative; }
    .page-item.selected { border-color: #3b82f6; }
    .page-number { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    canvas { width: 100%; pointer-events: none; background: white; border-radius: 4px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <input type="file" id="addInput" accept="application/pdf" style="display:none">
    <button onclick="document.getElementById('addInput').click()" style="background:#3b82f6">指定位置へ追加</button>
    <button onclick="undo()">Undo</button>
    <button onclick="deleteSelected()" style="background:#ef4444">選択削除</button>
    <button onclick="exportPdf()" style="background:#10b981">名前を付けて保存</button>
</div>
<div id="pages"></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let pages = []; // {blob: Blob, selected: boolean}
    let history = [];

    function saveHistory() {
        history.push(pages.map(p => ({ blob: p.blob, selected: p.selected })));
    }

    // ページ番号と見た目を更新する関数（全再描画を避ける）
    function updateLayout() {
        const container = document.getElementById('pages');
        const items = container.querySelectorAll('.page-item');
        items.forEach((item, index) => {
            // 番号の表示を更新
            let numLabel = item.querySelector('.page-number');
            if(!numLabel) {
                numLabel = document.createElement('div');
                numLabel.className = 'page-number';
                item.appendChild(numLabel);
            }
            numLabel.textContent = (index + 1);
        });
    }

    // 描画は初回のみ、またはページ追加時のみ実行
    async function renderNewPages(newBlobList) {
        const container = document.getElementById('pages');
        for (const blob of newBlobList) {
            const div = document.createElement('div');
            div.className = 'page-item';
            div.onclick = () => { div.classList.toggle('selected'); };
            
            const canvas = document.createElement('canvas');
            div.appendChild(canvas);
            container.appendChild(div);

            const buffer = await blob.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
        updateLayout();
    }

    async function addPages(file, isInitial = false) {
        saveHistory();
        if(isInitial) { pages = []; document.getElementById('pages').innerHTML = ''; }
        
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(new Uint8Array(buffer));
        const newPageData = [];
        const newBlobs = [];
        
        for (let i = 0; i < pdf.getPageCount(); i++) {
            const doc = await PDFLib.PDFDocument.create();
            const [p] = await doc.copyPages(pdf, [i]);
            doc.addPage(p);
            const bytes = await doc.save();
            const blob = new Blob([bytes], {type: 'application/pdf'});
            newPageData.push({ blob, selected: false });
            newBlobs.push(blob);
        }

        const selectedIndex = pages.findIndex(p => document.getElementById('pages').children[pages.indexOf(p)].classList.contains('selected'));
        
        if (selectedIndex !== -1) {
            pages.splice(selectedIndex, 0, ...newPageData);
        } else {
            pages.push(...newPageData);
        }
        
        // 再描画を「追加分だけ」に限定して負荷を減らす
        if (isInitial) {
            await renderNewPages(newBlobs);
        } else {
            // ページ追加時は全再構築が安全（簡単のため）
            await renderFull();
        }
    }

    async function renderFull() {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        for(const p of pages) {
            const div = document.createElement('div');
            div.className = p.selected ? 'page-item selected' : 'page-item';
            div.onclick = () => { div.classList.toggle('selected'); };
            const canvas = document.createElement('canvas');
            div.appendChild(canvas);
            container.appendChild(div);
            const buffer = await p.blob.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
        updateLayout();
    }

    function deleteSelected() {
        const items = document.querySelectorAll('.page-item');
        const newPages = [];
        items.forEach((item, i) => {
            if (!item.classList.contains('selected')) {
                newPages.push(pages[i]);
            } else {
                item.remove(); // DOMから即座に削除（再描画不要）
            }
        });
        saveHistory();
        pages = newPages;
        updateLayout(); // 番号だけ振り直す
    }

    function undo() {
        if (history.length === 0) return;
        pages = history.pop();
        renderFull();
    }

    new Sortable(document.getElementById('pages'), {
        animation: 150,
        onEnd: (evt) => {
            if (evt.oldIndex === evt.newIndex) return;
            saveHistory();
            const movedItem = pages.splice(evt.oldIndex, 1)[0];
            pages.splice(evt.newIndex, 0, movedItem);
            updateLayout(); // 順序が変わったら番号だけ更新
        }
    });

    // ... (exportPdfはそのまま) ...
</script>
</body>
</html>
