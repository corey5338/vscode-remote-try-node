<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#3b82f6;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:linear-gradient(to bottom,#0f172a,#020617);
    color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;
}

.toolbar{
    position:sticky;
    top:12px;
    z-index:1000;

    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;

    padding:18px 22px;

    background:rgba(30,41,59,.9);

    backdrop-filter:blur(12px);

    border-radius:18px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

button{
    border:none;
    padding:10px 16px;
    border-radius:10px;
    background:#334155;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    background:#475569;
    transform:translateY(-1px);
}

button.primary{
    background:var(--accent);
}

button.danger{
    background:var(--danger);
}

.divider{
    width:1px;
    height:22px;
    background:#475569;
}

#status{
    margin-left:auto;
    color:var(--muted);
}

#pages{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:22px;
    margin-top:24px;
}

.page-item{
    background:var(--panel);
    border-radius:16px;
    overflow:hidden;
    border:2px solid transparent;
    transition:.15s;
    cursor:move;
}

.page-item:hover{
    transform:translateY(-2px);
}

.page-item.selected{
    border-color:var(--accent);
    background:#1d4ed8;
}

.preview{
    background:#0b1220;
    padding:10px;
}

canvas{
    width:100%;
    display:block;
    border-radius:10px;
    background:white;
}

.page-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
}

.page-num{
    font-size:.82rem;
    color:var(--muted);
}

.page-check{
    width:18px;
    height:18px;
    accent-color:var(--accent);
}

.placeholder{
    aspect-ratio:0.7;
    background:#111827;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#64748b;
    font-size:.8rem;
}

.empty{
    margin-top:120px;
    text-align:center;
    color:var(--muted);
}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="document.getElementById('fileInput').click()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <div class="divider"></div>

    <button onclick="undo()">
        Undo
    </button>

    <button class="danger" onclick="deleteSelected()">
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        style="background:#8b5cf6;"
        onclick="exportSelected()"
    >
        抽出保存
    </button>

    <button class="primary" onclick="exportPdf()">
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];
let historyStack = [];
let lastSelectedIndex = -1;

const PAGE_HEIGHT = 260;
const BUFFER = 12;

let visibleStart = 0;
let visibleEnd = 0;

const renderQueue = [];

let renderRunning = false;

const renderedMap = new Map();

/* =====================================================
   Spacer
===================================================== */

const topSpacer =
    document.createElement('div');

const bottomSpacer =
    document.createElement('div');

pagesContainer.appendChild(topSpacer);
pagesContainer.appendChild(bottomSpacer);

/* =====================================================
   Status
===================================================== */

function setStatus(text){

    document
    .getElementById('status')
    .textContent = text;

}

/* =====================================================
   History
===================================================== */

function saveHistory(){

    historyStack.push([...pageList]);

    if(historyStack.length > 30){

        historyStack.shift();

    }

}

/* =====================================================
   Sortable
===================================================== */

new Sortable(pagesContainer,{

    animation:180,

    ghostClass:'selected',

    draggable:'.page-item',

    onEnd:()=>{

        const items =
            Array.from(
                document.querySelectorAll(
                    '.page-item'
                )
            );

        const visibleItems =
            pageList.slice(
                visibleStart,
                visibleEnd
            );

        items.forEach((el,index)=>{

            visibleItems[index] =
                el.pageData;

        });

        pageList.splice(
            visibleStart,
            visibleItems.length,
            ...visibleItems
        );

        updateVisiblePages();

    }

});

/* =====================================================
   File Input
===================================================== */

document
.getElementById('fileInput')
.onchange = e => {

    processFile(
        e.target.files[0],
        true
    );

};

/* =====================================================
   Process PDF
===================================================== */

async function processFile(file,isReset){

    try{

        if(isReset){

            cleanupAllPages();

            pageList = [];
            historyStack = [];

            renderedMap.clear();

        }

        setStatus('PDF読込中...');

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(pdfBytes);

        const pdfjsDoc =
            await pdfjsLib
            .getDocument({
                data:pdfBytes.slice(0)
            }).promise;

        const total =
            pdfDoc.getPageCount();

        for(let i=0;i<total;i++){

            pageList.push({

                id:
                    crypto.randomUUID(),

                doc:
                    pdfDoc,

                pdfjsDoc:
                    pdfjsDoc,

                pageIndex:
                    i,

                selected:false,

                thumb:null,

                rendered:false,

                rendering:false,

                renderTask:null

            });

        }

        updateContainerHeight();

        updateVisiblePages();

        setStatus(
            `${total}ページ読込完了`
        );

    }catch(err){

        console.error(err);

        setStatus('エラー');

    }

}

/* =====================================================
   Container Height
===================================================== */

function updateContainerHeight(){

    const totalHeight =
        pageList.length *
        PAGE_HEIGHT;

    pagesContainer.style.position =
        'relative';

    pagesContainer.style.minHeight =
        totalHeight + 'px';

}

/* =====================================================
   Scroll
===================================================== */

window.addEventListener(
    'scroll',
    throttle(updateVisiblePages,16)
);

/* =====================================================
   Visible Pages
===================================================== */

function updateVisiblePages(){

    const scrollTop =
        window.scrollY;

    const viewportHeight =
        window.innerHeight;

    const start =
        Math.max(
            0,
            Math.floor(
                scrollTop / PAGE_HEIGHT
            ) - BUFFER
        );

    const end =
        Math.min(
            pageList.length,
            Math.ceil(
                (scrollTop + viewportHeight)
                / PAGE_HEIGHT
            ) + BUFFER
        );

    if(
        start === visibleStart &&
        end === visibleEnd
    ){
        return;
    }

    visibleStart = start;
    visibleEnd = end;

    renderVisiblePages();

}

/* =====================================================
   Render Visible
===================================================== */

function renderVisiblePages(){

    const fragment =
        document.createDocumentFragment();

    topSpacer.style.height =
        (visibleStart * PAGE_HEIGHT)
        + 'px';

    bottomSpacer.style.height =
        (
            (pageList.length - visibleEnd)
            * PAGE_HEIGHT
        ) + 'px';

    cleanupInvisiblePages();

    for(
        let i=visibleStart;
        i<visibleEnd;
        i++
    ){

        const p = pageList[i];

        let el =
            renderedMap.get(p.id);

        if(!el){

            el =
                createPageElement(
                    p,
                    i
                );

            renderedMap.set(
                p.id,
                el
            );

        }

        el.querySelector('.page-num')
        .textContent =
            `Page ${i + 1}`;

        fragment.appendChild(el);

        if(
            !p.rendered &&
            !p.rendering
        ){

            renderQueue.push(p);

        }

    }

    pagesContainer.innerHTML = '';

    pagesContainer.appendChild(topSpacer);

    pagesContainer.appendChild(fragment);

    pagesContainer.appendChild(bottomSpacer);

    processRenderQueue();

}

/* =====================================================
   Cleanup Invisible
===================================================== */

function cleanupInvisiblePages(){

    renderedMap.forEach((el,id)=>{

        const p =
            el.pageData;

        const index =
            pageList.indexOf(p);

        if(
            index < visibleStart ||
            index > visibleEnd
        ){

            if(
                p.renderTask &&
                p.renderTask.cancel
            ){

                try{

                    p.renderTask.cancel();

                }catch{}

            }

        }

    });

}

/* =====================================================
   Create Page
===================================================== */

function createPageElement(p,index){

    const div =
        document.createElement('div');

    div.className =
        'page-item';

    div.pageData = p;

    div.innerHTML = `

        <div class="preview">

            <div class="placeholder">
                Loading...
            </div>

            <canvas style="display:none;"></canvas>

        </div>

        <div class="page-footer">

            <div class="page-num">
                Page ${index + 1}
            </div>

            <input
                type="checkbox"
                class="page-check"
            >

        </div>

    `;

    setupSelection(
        div,
        p,
        index
    );

    if(p.thumb){

        restoreThumbnail(
            p,
            div
        );

    }

    return div;

}

/* =====================================================
   Selection
===================================================== */

function setupSelection(div,p,index){

    const checkbox =
        div.querySelector('.page-check');

    checkbox.checked =
        p.selected;

    if(p.selected){

        div.classList.add(
            'selected'
        );

    }

    checkbox.onclick =
        e=>e.stopPropagation();

    checkbox.onchange = ()=>{

        p.selected =
            checkbox.checked;

        div.classList.toggle(
            'selected',
            p.selected
        );

    };

    div.onclick = e => {

        if(
            e.shiftKey &&
            lastSelectedIndex !== -1
        ){

            const start =
                Math.min(
                    lastSelectedIndex,
                    index
                );

            const end =
                Math.max(
                    lastSelectedIndex,
                    index
                );

            for(
                let i=start;
                i<=end;
                i++
            ){

                pageList[i]
                .selected = true;

            }

        }else{

            p.selected =
                !p.selected;

        }

        lastSelectedIndex =
            index;

        updateVisiblePages();

    };

}

/* =====================================================
   Render Queue
===================================================== */

async function processRenderQueue(){

    if(renderRunning)
        return;

    renderRunning = true;

    while(renderQueue.length){

        const p =
            renderQueue.shift();

        if(
            !p ||
            p.rendered ||
            p.rendering
        ){
            continue;
        }

        await renderThumbnail(p);

        await idle();

    }

    renderRunning = false;

}

function idle(){

    return new Promise(resolve=>{

        requestIdleCallback(
            ()=>resolve(),
            {
                timeout:100
            }
        );

    });

}

/* =====================================================
   Thumbnail
===================================================== */

async function renderThumbnail(p){

    if(
        p.rendered ||
        p.rendering
    ) return;

    p.rendering = true;

    try{

        const page =
            await p.pdfjsDoc.getPage(
                p.pageIndex + 1
            );

        const viewport =
            page.getViewport({
                scale:0.17
            });

        const el =
            renderedMap.get(p.id);

        if(!el){

            p.rendering = false;
            return;

        }

        const canvas =
            el.querySelector('canvas');

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha:false
                }
            );

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        p.renderTask =
            page.render({

                canvasContext:ctx,

                viewport

            });

        await p.renderTask.promise;

        p.thumb =
            canvas.toDataURL(
                'image/webp',
                0.5
            );

        p.rendered = true;

        const placeholder =
            el.querySelector(
                '.placeholder'
            );

        if(placeholder){

            placeholder.remove();

        }

        canvas.style.display =
            'block';

    }catch(err){

        if(
            err?.name !==
            'RenderingCancelledException'
        ){

            console.error(err);

        }

    }

    p.renderTask = null;

    p.rendering = false;

}

/* =====================================================
   Restore
===================================================== */

function restoreThumbnail(p,el){

    const canvas =
        el.querySelector('canvas');

    const img =
        new Image();

    img.src = p.thumb;

    img.onload = ()=>{

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        canvas
        .getContext('2d')
        .drawImage(
            img,
            0,
            0
        );

    };

    const placeholder =
        el.querySelector(
            '.placeholder'
        );

    if(placeholder){

        placeholder.remove();

    }

    canvas.style.display =
        'block';

}

/* =====================================================
   Delete
===================================================== */

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length === 0){

        alert(
            '削除ページを選択してください'
        );

        return;

    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    updateContainerHeight();

    updateVisiblePages();

}

/* =====================================================
   Undo
===================================================== */

function undo(){

    if(
        historyStack.length === 0
    ) return;

    pageList =
        historyStack.pop();

    updateContainerHeight();

    updateVisiblePages();

}

/* =====================================================
   Clear Selection
===================================================== */

function clearSelection(){

    pageList.forEach(p=>{

        p.selected = false;

    });

    updateVisiblePages();

}

/* =====================================================
   Export
===================================================== */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名',
            'edited.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length === 0){

        alert(
            'ページを選択'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名',
            'extract.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    downloadPdf(
        await newPdf.save(),
        name
    );

}

function downloadPdf(bytes,name){

    const blob =
        new Blob(
            [bytes],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

}

/* =====================================================
   Add PDF
===================================================== */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept =
        'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        if(!file) return;

        const pages =
            await getPagesFromPdf(file);

        saveHistory();

        let insertIndex =
            pageList.length;

        const selectedIndex =
            pageList.findLastIndex(
                p=>p.selected
            );

        if(selectedIndex !== -1){

            insertIndex =
                selectedIndex + 1;

        }

        pageList.splice(
            insertIndex,
            0,
            ...pages
        );

        updateContainerHeight();

        updateVisiblePages();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib
        .PDFDocument
        .load(pdfBytes);

    const pdfjsDoc =
        await pdfjsLib
        .getDocument({
            data:pdfBytes.slice(0)
        }).promise;

    const pages = [];

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        pages.push({

            id:
                crypto.randomUUID(),

            doc:
                pdfDoc,

            pdfjsDoc:
                pdfjsDoc,

            pageIndex:i,

            selected:false,

            thumb:null,

            rendered:false,

            rendering:false,

            renderTask:null

        });

    }

    return pages;

}

/* =====================================================
   Cleanup
===================================================== */

function cleanupAllPages(){

    pageList.forEach(p=>{

        if(
            p.renderTask &&
            p.renderTask.cancel
        ){

            try{

                p.renderTask.cancel();

            }catch{}

        }

    });

}

/* =====================================================
   Throttle
===================================================== */

function throttle(fn,wait){

    let last = 0;

    return (...args)=>{

        const now = Date.now();

        if(now - last >= wait){

            last = now;

            fn(...args);

        }

    };

}

</script>

</body>
</html>
