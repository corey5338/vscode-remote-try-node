<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Architect Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#273549;
    --accent:#3b82f6;
    --danger:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;

    background:
        radial-gradient(circle at top left,#1e293b,#0f172a 45%);

    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;

}

/* ======================
   Toolbar
====================== */

.toolbar{

    position:sticky;
    top:12px;
    z-index:1000;

    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;

    padding:18px 22px;

    background:
        rgba(30,41,59,.92);

    backdrop-filter:blur(12px);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:18px;

    box-shadow:
        0 12px 32px rgba(0,0,0,.35);

}

button{

    border:none;

    padding:10px 16px;

    border-radius:10px;

    background:#334155;

    color:white;

    font-weight:600;

    cursor:pointer;

    transition:.18s;

}

button:hover{

    transform:translateY(-1px);

    background:#475569;

}

button.primary{

    background:var(--accent);

}

button.primary:hover{

    background:#2563eb;

}

button.danger{

    background:var(--danger);

}

button.danger:hover{

    background:#dc2626;

}

.divider{

    width:1px;
    height:22px;

    background:#475569;

}

#status{

    margin-left:auto;

    color:var(--muted);

    font-size:.9rem;

}

/* ======================
   Grid
====================== */

#pages{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

    gap:22px;

    margin-top:24px;

}

/* ======================
   Page Item
====================== */

.page-item{

    background:var(--panel);

    border-radius:16px;

    overflow:hidden;

    border:2px solid transparent;

    cursor:move;

    transition:.18s;

    box-shadow:
        0 6px 18px rgba(0,0,0,.22);

}

.page-item:hover{

    transform:translateY(-3px);

    border-color:#64748b;

}

.page-item.selected{

    border-color:var(--accent);

    background:#1d4ed8;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.28);

}

.preview{

    padding:10px;

    background:#0b1220;

}

canvas{

    width:100%;

    display:block;

    border-radius:10px;

    background:white;

}

/* ======================
   Footer
====================== */

.page-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 12px;

}

.page-num{

    color:var(--muted);

    font-size:.8rem;

    font-weight:600;

}

.page-check{

    width:18px;
    height:18px;

    accent-color:var(--accent);

}

/* ======================
   Empty
====================== */

.empty{

    margin-top:100px;

    text-align:center;

    color:var(--muted);

    font-size:1rem;

}

</style>
</head>

<body>

<div class="toolbar">

    <input
        type="file"
        id="fileInput"
        hidden
        accept="application/pdf"
    >

    <button onclick="document.getElementById('fileInput').click()">
        新規読み込み
    </button>

    <button onclick="addPdf()">
        指定位置へ追加
    </button>

    <div class="divider"></div>

    <button onclick="undo()">
        Undo
    </button>

    <button
        class="danger"
        onclick="deleteSelected()"
    >
        削除
    </button>

    <button onclick="clearSelection()">
        選択解除
    </button>

    <button
        class="primary"
        style="background:#8b5cf6;"
        onclick="exportSelected()"
    >
        抽出して保存
    </button>

    <button
        class="primary"
        onclick="exportPdf()"
    >
        全保存
    </button>

    <div id="status">
        Ready
    </div>

</div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pageList = [];

let historyStack = [];

let lastSelectedIndex = -1;

/* ======================
   History
====================== */

function saveHistory(){

    historyStack.push([...pageList]);

}

/* ======================
   Sortable
====================== */

new Sortable(document.getElementById('pages'), {

    animation:200,

    ghostClass:'selected',

    onEnd:() => {

        saveHistory();

        const container =
            document.getElementById('pages');

        const newOrder =
            Array
            .from(container.children)
            .map(div =>
                parseInt(div.dataset.index)
            );

        pageList =
            newOrder.map(i => pageList[i]);

        render();

    }

});

/* ======================
   Status
====================== */

function setStatus(text){

    document
    .getElementById('status')
    .textContent = text;

}

/* ======================
   Load PDF
====================== */

document
.getElementById('fileInput')
.onchange = (e) => {

    processFile(
        e.target.files[0],
        true
    );

};

async function processFile(file,isReset){

    const statusEl =
        document.getElementById('status');

    if(isReset){

        pageList = [];

        historyStack = [];

    }

    try{

        statusEl.textContent =
            '処理中...';

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(
                new Uint8Array(pdfBytes)
            );

        const total =
            pdfDoc.getPageCount();

        for(let i=0;i<total;i++){

            statusEl.textContent =
                `読み込み: ${i+1}/${total}`;

            const thumb =
                await generateThumb(
                    pdfBytes,
                    i
                );

            pageList.push({

                doc:pdfDoc,

                pageIndex:i,

                thumb:thumb

            });

        }

        render();

        statusEl.textContent =
            '完了';

    }catch(e){

        console.error(e);

        statusEl.textContent =
            'エラー';

    }

}

/* ======================
   Add PDF
====================== */

async function addPdf(){

    const input =
        document.createElement('input');

    input.type = 'file';

    input.accept = 'application/pdf';

    input.onchange = async(e)=>{

        const file =
            e.target.files[0];

        const container =
            document.getElementById('pages');

        const selectedElements =
            Array
            .from(container.children)
            .filter(d =>
                d.classList.contains(
                    'selected'
                )
            );

        const insertAfter =
            selectedElements.length > 0
            ? parseInt(
                selectedElements[
                    selectedElements.length-1
                ].dataset.index
              )
            : pageList.length - 1;

        const tempPages =
            await getPagesFromPdf(file);

        saveHistory();

        pageList.splice(
            insertAfter + 1,
            0,
            ...tempPages
        );

        render();

    };

    input.click();

}

async function getPagesFromPdf(file){

    const statusEl =
        document.getElementById('status');

    const newPages = [];

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib
        .PDFDocument
        .load(
            new Uint8Array(pdfBytes)
        );

    for(
        let i=0;
        i<pdfDoc.getPageCount();
        i++
    ){

        statusEl.textContent =
            `挿入中: ${i+1}/${pdfDoc.getPageCount()}`;

        const thumb =
            await generateThumb(
                pdfBytes,
                i
            );

        newPages.push({

            doc:pdfDoc,

            pageIndex:i,

            thumb:thumb

        });

    }

    return newPages;

}

/* ======================
   Undo
====================== */

function undo(){

    if(historyStack.length === 0)
        return;

    pageList =
        historyStack.pop();

    render();

}

/* ======================
   Delete
====================== */

function deleteSelected(){

    saveHistory();

    const container =
        document.getElementById('pages');

    const selected =
        Array
        .from(container.children)
        .map(d =>
            d.classList.contains(
                'selected'
            )
        );

    pageList =
        pageList.filter(
            (_,i)=>!selected[i]
        );

    render();

}

/* ======================
   Clear Selection
====================== */

function clearSelection(){

    const container =
        document.getElementById('pages');

    Array
    .from(container.children)
    .forEach(div=>{

        div.classList.remove(
            'selected'
        );

    });

    lastSelectedIndex = -1;

}

/* ======================
   Generate Thumb
====================== */

async function generateThumb(
    pdfBytes,
    pageIndex
){

    const bytes =
        new Uint8Array(
            pdfBytes.slice(0)
        );

    const pdf =
        await pdfjsLib
        .getDocument({
            data:bytes
        }).promise;

    const page =
        await pdf.getPage(
            pageIndex + 1
        );

    const canvas =
        document.createElement(
            'canvas'
        );

    const viewport =
        page.getViewport({
            scale:0.15
        });

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    await page.render({

        canvasContext:
            canvas.getContext('2d'),

        viewport:viewport

    }).promise;

    return canvas.toDataURL(
        'image/webp',
        0.4
    );

}

/* ======================
   Render
====================== */

function render(){

    const container =
        document.getElementById('pages');

    if(pageList.length === 0){

        container.innerHTML = `
            <div class="empty">
                PDFを読み込んでください
            </div>
        `;

        return;

    }

    container.innerHTML = '';

    pageList.forEach((p,i)=>{

        const div =
            document.createElement('div');

        div.className =
            'page-item';

        div.dataset.index = i;

        div.innerHTML = `

            <div class="preview">
                <canvas></canvas>
            </div>

            <div class="page-footer">

                <div class="page-num">
                    Page ${i+1}
                </div>

                <input
                    type="checkbox"
                    class="page-check"
                >

            </div>

        `;

        const canvas =
            div.querySelector('canvas');

        const img =
            new Image();

        img.src = p.thumb;

        img.onload = ()=>{

            canvas.width =
                img.width;

            canvas.height =
                img.height;

            canvas
            .getContext('2d')
            .drawImage(
                img,
                0,
                0
            );

        };

        div.onclick = (e)=>{

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(
                        lastSelectedIndex,
                        i
                    );

                const end =
                    Math.max(
                        lastSelectedIndex,
                        i
                    );

                const items =
                    Array.from(
                        container.children
                    );

                for(
                    let j=start;
                    j<=end;
                    j++
                ){

                    items[j]
                    .classList
                    .add('selected');

                    items[j]
                    .querySelector(
                        '.page-check'
                    ).checked = true;

                }

            }else{

                div.classList.toggle(
                    'selected'
                );

                div.querySelector(
                    '.page-check'
                ).checked =
                    div.classList.contains(
                        'selected'
                    );

            }

            lastSelectedIndex = i;

        };

        container.appendChild(div);

    });

}

/* ======================
   Export PDF
====================== */

async function exportPdf(){

    const name =
        prompt(
            'ファイル名:',
            'edited.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(let p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download = name;

    a.click();

}

/* ======================
   Export Selected
====================== */

async function exportSelected(){

    const container =
        document.getElementById('pages');

    const selectedIndices =
        Array
        .from(container.children)
        .map((div,i)=>
            div.classList.contains(
                'selected'
            )
            ? i
            : -1
        )
        .filter(i=>i!==-1);

    if(selectedIndices.length === 0){

        alert(
            '抽出したいページを選択してください'
        );

        return;

    }

    const name =
        prompt(
            '抽出ファイル名:',
            'extracted.pdf'
        );

    if(!name) return;

    const newPdf =
        await PDFLib
        .PDFDocument
        .create();

    for(let idx of selectedIndices){

        const p =
            pageList[idx];

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {
                type:'application/pdf'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        name.endsWith('.pdf')
        ? name
        : name + '.pdf';

    a.click();

}

</script>

</body>
</html>
