<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:sans-serif;
}

.toolbar{
    position:sticky;
    top:0;
    z-index:9999;
    background:#1f2937;
    padding:10px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid #374151;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.danger{
    background:#dc2626;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
    padding:20px;
}

.page{
    background:#1f2937;
    border-radius:12px;
    overflow:hidden;
    border:3px solid transparent;
}

.page.selected{
    border-color:#2563eb;
}

.page-header{
    background:#374151;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.page-body{
    padding:10px;
}

canvas{
    width:100%;
    background:white;
}

.info{
    padding:8px;
    font-size:12px;
    color:#d1d5db;
}

</style>
</head>

<body>

<div class="toolbar">

<input type="file" id="fileInput" accept="application/pdf">

<input type="file" id="addInput" accept="application/pdf">

<button class="danger" onclick="deleteSelected()">
削除
</button>

<button onclick="extractSelected()">
抽出保存
</button>

<button onclick="savePdf()">
保存
</button>

<button onclick="selectAll()">
全選択
</button>

<button onclick="clearSelection()">
選択解除
</button>

</div>

<div class="grid" id="pages"></div>

<script type="module">

import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

const { PDFDocument } = PDFLib;

let originalPdfBytes = null;

let pagesData = [];

const pagesEl = document.getElementById('pages');

document.getElementById('fileInput')
.addEventListener('change', async(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    originalPdfBytes = await file.arrayBuffer();

    await loadPdf(originalPdfBytes);

});

document.getElementById('addInput')
.addEventListener('change', async(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const addBytes = await file.arrayBuffer();

    const addPdf = await PDFDocument.load(addBytes);

    const pageCount = addPdf.getPageCount();

    for(let i=0;i<pageCount;i++){

        pagesData.push({
            sourceBytes:addBytes,
            sourcePageIndex:i,
            selected:false,
            id:crypto.randomUUID()
        });

    }

    renderPages();

});

async function loadPdf(bytes){

    pagesData = [];

    const pdf = await PDFDocument.load(bytes);

    const total = pdf.getPageCount();

    for(let i=0;i<total;i++){

        pagesData.push({
            sourceBytes:bytes,
            sourcePageIndex:i,
            selected:false,
            id:crypto.randomUUID()
        });

    }

    renderPages();

}

async function renderPages(){

    pagesEl.innerHTML='';

    for(let i=0;i<pagesData.length;i++){

        const p = pagesData[i];

        const pageDiv = document.createElement('div');

        pageDiv.className='page';

        if(p.selected){
            pageDiv.classList.add('selected');
        }

        pageDiv.dataset.id=p.id;

        const header=document.createElement('div');

        header.className='page-header';

        const checkbox=document.createElement('input');

        checkbox.type='checkbox';

        checkbox.checked=p.selected;

        checkbox.addEventListener('change',()=>{

            p.selected=checkbox.checked;

            if(p.selected){
                pageDiv.classList.add('selected');
            }else{
                pageDiv.classList.remove('selected');
            }

        });

        const label=document.createElement('span');

        label.textContent='ページ '+(i+1);

        header.appendChild(checkbox);

        header.appendChild(label);

        const body=document.createElement('div');

        body.className='page-body';

        const canvas=document.createElement('canvas');

        body.appendChild(canvas);

        const info=document.createElement('div');

        info.className='info';

        info.textContent=
            '元ページ: '+
            (p.sourcePageIndex+1);

        body.appendChild(info);

        pageDiv.appendChild(header);

        pageDiv.appendChild(body);

        pagesEl.appendChild(pageDiv);

        await renderPdfPage(
            p.sourceBytes,
            p.sourcePageIndex,
            canvas
        );

    }

    Sortable.create(pagesEl,{
        animation:150,

        onEnd:(evt)=>{

            const moved=
                pagesData.splice(evt.oldIndex,1)[0];

            pagesData.splice(
                evt.newIndex,
                0,
                moved
            );

        }
    });

}
async function renderPdfPage(bytes,pageIndex,canvas){

    const pdf=await pdfjsLib.getDocument({
        data:bytes
    }).promise;

    const page=await pdf.getPage(pageIndex+1);

    const viewport=page.getViewport({
        scale:0.5
    });

    const context=canvas.getContext('2d');

    canvas.width=viewport.width;

    canvas.height=viewport.height;

    await page.render({
        canvasContext:context,
        viewport:viewport
    }).promise;

}

function selectAll(){

    pagesData.forEach(p=>{
        p.selected=true;
    });

    renderPages();

}

function clearSelection(){

    pagesData.forEach(p=>{
        p.selected=false;
    });

    renderPages();

}

function deleteSelected(){

    pagesData=
        pagesData.filter(p=>!p.selected);

    renderPages();

}

async function savePdf(){

    if(pagesData.length===0){
        alert('ページがありません');
        return;
    }

    const newPdf=
        await PDFDocument.create();

    for(const p of pagesData){

        const srcPdf=
            await PDFDocument.load(
                p.sourceBytes
            );

        const copied=
            await newPdf.copyPages(
                srcPdf,
                [p.sourcePageIndex]
            );

        newPdf.addPage(copied[0]);

    }

    const pdfBytes=
        await newPdf.save();

    downloadPdf(
        pdfBytes,
        'edited.pdf'
    );

}

async function extractSelected(){

    const selected=
        pagesData.filter(p=>p.selected);

    if(selected.length===0){

        alert('選択してください');

        return;

    }

    const newPdf=
        await PDFDocument.create();

    for(const p of selected){

        const srcPdf=
            await PDFDocument.load(
                p.sourceBytes
            );

        const copied=
            await newPdf.copyPages(
                srcPdf,
                [p.sourcePageIndex]
            );

        newPdf.addPage(copied[0]);

    }

    const pdfBytes=
        await newPdf.save();

    downloadPdf(
        pdfBytes,
        'extracted.pdf'
    );

}

function downloadPdf(bytes,fileName){

    const blob=
        new Blob(
            [bytes],
            {
                type:'application/pdf'
            }
        );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement('a');

    a.href=url;

    a.download=fileName;

    a.click();

    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
