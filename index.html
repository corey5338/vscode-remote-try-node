<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF Architect Pro Ultimate</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
:root{
    --bg:#020617;
    --panel:#0f172a;
    --panel2:#1e293b;
    --accent:#2563eb;
    --danger:#dc2626;
    --text:#f8fafc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    display:grid;
    grid-template-columns:260px 1fr;
    height:100vh;
}

.sidebar{
    background:var(--panel);
    padding:18px;
    overflow:auto;
    border-right:1px solid #334155;
}

.main{
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.toolbar-title{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:18px;
}

.group{
    margin-bottom:20px;
    background:rgba(255,255,255,.03);
    padding:14px;
    border-radius:16px;
}

.group-title{
    color:#94a3b8;
    font-size:.8rem;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    background:#334155;
    color:white;
    font-weight:bold;
}

button:hover{
    filter:brightness(1.1);
}

.primary{
    background:var(--accent);
}

.danger{
    background:var(--danger);
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#020617;
    color:white;
    margin-bottom:10px;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

#pages{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.page{
    background:var(--panel2);
    border-radius:18px;
    padding:12px;
    border:2px solid transparent;
    cursor:pointer;
}

.page.selected{
    border-color:#3b82f6;
}

.preview{
    aspect-ratio:0.7;
    background:#0f172a;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.meta{
    margin-top:10px;
}

.statusbar{
    height:42px;
    border-top:1px solid #334155;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#0f172a;
}

.badge{
    position:absolute;
    top:10px;
    right:10px;
    background:#020617;
    padding:4px 8px;
    border-radius:999px;
    font-size:.7rem;
}

.loading{
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="app">

<div class="sidebar">

<div class="toolbar-title">
PDF Architect Pro
</div>

<div class="group">

<div class="group-title">読み込み</div>

<input type="file" id="fileInput" hidden accept="application/pdf">

<button class="primary" onclick="openFileDialog()">
新規読み込み
</button>

<button onclick="addPdf()">
PDF追加
</button>

<input id="insertInput" type="number" placeholder="追加位置">

</div>

<div class="group">

<div class="group-title">編集</div>

<button onclick="moveSelectedPages()">
選択ページ移動
</button>

<input id="moveInput" type="number" placeholder="移動先">

<button onclick="rotateSelected(90)">
↻ 右回転
</button>

<button onclick="rotateSelected(-90)">
↺ 左回転
</button>

<button onclick="undo()">
Undo
</button>

<button class="danger" onclick="deleteSelected()">
削除
</button>

<button onclick="clearSelection()">
選択解除
</button>

</div>

<div class="group">

<div class="group-title">保存</div>

<button class="primary" onclick="exportSelected()">
抽出保存
</button>

<button class="primary" onclick="exportPdf()">
全保存
</button>

</div>

</div>

<div class="main">

<div class="content">
<div id="pages"></div>
</div>

<div class="statusbar">
<div id="status">Ready</div>
</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer =
    document.getElementById('pages');

let pageList = [];
let historyStack = [];
let lastSelectedIndex = -1;
const thumbCache = new Map();

function setStatus(text){
    document.getElementById('status').textContent = text;
}

function openFileDialog(){
    document.getElementById('fileInput').click();
}

document.getElementById('fileInput').onchange = e=>{
    const file = e.target.files[0];
    if(file){
        processFile(file,true);
    }
};

function saveHistory(){

    historyStack.push(
        pageList.map(p=>({
            ...p,
            selected:p.selected,
            rotation:p.rotation
        }))
    );

    if(historyStack.length > 20){
        historyStack.shift();
    }

}

async function processFile(file,isReset){

    if(isReset){
        pageList = [];
        historyStack = [];
    }

    setStatus('PDF読み込み中...');

    const pdfBytes =
        await file.arrayBuffer();

    const pdfDoc =
        await PDFLib.PDFDocument.load(pdfBytes);

    const total =
        pdfDoc.getPageCount();

    for(let i=0;i<total;i++){

        pageList.push({
            id:crypto.randomUUID(),
            doc:pdfDoc,
            pdfBytes,
            pageIndex:i,
            selected:false,
            rotation:0,
            thumb:null,
            fileName:file.name
        });

    }

    render();

    setStatus(`${total}ページ読み込み`);

}

async function addPdf(){

    const input =
        document.createElement('input');

    input.type='file';
    input.accept='application/pdf';

    input.onchange = async e=>{

        const file = e.target.files[0];

        if(!file) return;

        const insertInput =
            document.getElementById('insertInput');

        if(insertInput.value.trim()===''){
            alert('追加位置を入力してください');
            return;
        }

        let insertPos =
            parseInt(insertInput.value,10)-1;

        if(Number.isNaN(insertPos)){
            alert('数値を入力してください');
            return;
        }

        saveHistory();

        const pdfBytes =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(pdfBytes);

        const newPages = [];

        for(let i=0;i<pdfDoc.getPageCount();i++){

            newPages.push({
                id:crypto.randomUUID(),
                doc:pdfDoc,
                pdfBytes,
                pageIndex:i,
                selected:false,
                rotation:0,
                thumb:null,
                fileName:file.name
            });

        }

        pageList.splice(insertPos,0,...newPages);

        render();

    };

    input.click();

}

async function generateThumbnail(p){

    const key =
        `${p.fileName}_${p.pageIndex}`;

    if(thumbCache.has(key)){
        return thumbCache.get(key);
    }

    const pdf =
        await pdfjsLib.getDocument({
            data:p.pdfBytes.slice(0)
        }).promise;

    const page =
        await pdf.getPage(
            p.pageIndex + 1
        );

    const viewport =
        page.getViewport({
            scale:0.20
        });

    const canvas =
        document.createElement('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    await page.render({
        canvasContext:ctx,
        viewport
    }).promise;

    const thumb =
        canvas.toDataURL('image/webp',0.7);

    thumbCache.set(key,thumb);

    page.cleanup();
    pdf.cleanup();
    pdf.destroy();

    return thumb;

}

async function render(){

    pagesContainer.innerHTML='';

    if(pageList.length===0){

        pagesContainer.innerHTML =
            '<div style="padding:40px;">PDFを読み込んでください</div>';

        return;

    }

    for(let index=0; index<pageList.length; index++){

        const p = pageList[index];

        const div =
            document.createElement('div');

        div.className='page';

        if(p.selected){
            div.classList.add('selected');
        }

        div.innerHTML = `
            <div class="preview">
                <div class="loading">Loading...</div>
            </div>

            <div class="meta">
                <div><b>Page ${index+1}</b></div>
                <div style="color:#94a3b8;font-size:.8rem;">
                    元ページ ${p.pageIndex+1}
                </div>
            </div>
        `;

        div.onclick = e=>{

            if(
                e.shiftKey &&
                lastSelectedIndex !== -1
            ){

                const start =
                    Math.min(index,lastSelectedIndex);

                const end =
                    Math.max(index,lastSelectedIndex);

                for(let i=start;i<=end;i++){
                    pageList[i].selected = true;
                }

            }else{

                p.selected = !p.selected;

            }

            lastSelectedIndex = index;

            updateSelectionUI();

        };

        pagesContainer.appendChild(div);

        const thumb =
            await generateThumbnail(p);

        p.thumb = thumb;

        div.querySelector('.preview').innerHTML = `
            <img
                src="${thumb}"
                style="
                    transform:
                        rotate(${p.rotation}deg);
                "
            >
        `;

    }

}

function updateSelectionUI(){

    Array.from(
        pagesContainer.children
    ).forEach((div,index)=>{

        div.classList.toggle(
            'selected',
            pageList[index].selected
        );

    });

}

function clearSelection(){

    pageList.forEach(
        p=>p.selected=false
    );

    updateSelectionUI();

}

function rotateSelected(deg){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){
        alert('回転ページを選択してください');
        return;
    }

    saveHistory();

    selected.forEach(p=>{
        p.rotation += deg;
    });

    render();

}

function deleteSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){
        alert('削除ページを選択してください');
        return;
    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    render();

}

function moveSelectedPages(){

    const input =
        document.getElementById('moveInput');

    if(input.value.trim()===''){
        alert('移動先ページ番号を入力してください');
        return;
    }

    let target =
        parseInt(input.value,10)-1;

    if(Number.isNaN(target)){
        alert('数値を入力してください');
        return;
    }

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){
        alert('移動ページを選択してください');
        return;
    }

    saveHistory();

    pageList =
        pageList.filter(
            p=>!p.selected
        );

    pageList.splice(
        target,
        0,
        ...selected
    );

    render();

}

function undo(){

    if(historyStack.length===0){
        return;
    }

    pageList =
        historyStack.pop();

    render();

}

async function exportPdf(){

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of pageList){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        if(p.rotation !== 0){

            page.setRotation(
                PDFLib.degrees(
                    p.rotation
                )
            );

        }

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {type:'application/pdf'}
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download='edited.pdf';

    a.click();

}

async function exportSelected(){

    const selected =
        pageList.filter(
            p=>p.selected
        );

    if(selected.length===0){
        alert('抽出ページを選択してください');
        return;
    }

    const newPdf =
        await PDFLib.PDFDocument.create();

    for(const p of selected){

        const [page] =
            await newPdf.copyPages(
                p.doc,
                [p.pageIndex]
            );

        if(p.rotation !== 0){

            page.setRotation(
                PDFLib.degrees(
                    p.rotation
                )
            );

        }

        newPdf.addPage(page);

    }

    const blob =
        new Blob(
            [await newPdf.save()],
            {type:'application/pdf'}
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download='selected.pdf';

    a.click();

}

new Sortable(pagesContainer,{

    animation:180,

    onEnd:(evt)=>{

        saveHistory();

        const moved =
            pageList.splice(
                evt.oldIndex,
                1
            )[0];

        pageList.splice(
            evt.newIndex,
            0,
            moved
        );

        render();

    }

});

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='a'
        ){

            e.preventDefault();

            pageList.forEach(
                p=>p.selected=true
            );

            updateSelectionUI();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==='z'
        ){

            e.preventDefault();

            undo();

        }

        if(e.key==='Delete'){
            deleteSelected();
        }

        if(e.key==='Escape'){
            clearSelection();
        }

    }
);

</script>

</body>
</html>
