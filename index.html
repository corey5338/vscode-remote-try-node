<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF Editor Pro</title>
<!-- ライブラリ読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
    body { margin: 0; background: #111; color: white; font-family: sans-serif; }
    .toolbar { background: #222; padding: 10px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #444; }
    #pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
    .page { background: #333; padding: 10px; border: 3px solid transparent; cursor: pointer; }
    .page.selected { border-color: #3b82f6; }
    canvas { width: 100%; background: white; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="deleteSelected()">削除</button>
    <button onclick="exportPdf()">保存</button>
</div>
<div id="pages"></div>

<script>
    // Worker設定を明示
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let originalBytes = null;
    let pdfLibDoc = null;
    let pagesData = [];

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 1. データを読み込む
        originalBytes = await file.arrayBuffer();
        
        // 2. PDFLibで構造をロード
        pdfLibDoc = await PDFLib.PDFDocument.load(originalBytes);
        
        // 3. プレビュー用のPDF.jsをロード
        const pdf = await pdfjsLib.getDocument({ data: originalBytes }).promise;
        
        pagesData = [];
        for (let i = 0; i < pdf.numPages; i++) {
            pagesData.push({ pageIndex: i, selected: false });
        }
        
        render(pdf);
    });

    async function render(pdf) {
        const container = document.getElementById('pages');
        container.innerHTML = '';
        
        for (let i = 0; i < pdf.numPages; i++) {
            const div = document.createElement('div');
            div.className = `page ${pagesData[i].selected ? 'selected' : ''}`;
            div.innerHTML = `<canvas id="c${i}"></canvas>`;
            div.onclick = () => {
                pagesData[i].selected = !pagesData[i].selected;
                div.className = `page ${pagesData[i].selected ? 'selected' : ''}`;
            };
            container.appendChild(div);

            // 描画処理
            const page = await pdf.getPage(i + 1);
            const canvas = document.getElementById('c' + i);
            const ctx = canvas.getContext('2d');
            const vp = page.getViewport({ scale: 0.2 });
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
        }
    }

    async function exportPdf() {
        const newPdf = await PDFLib.PDFDocument.create();
        const selectedIndices = pagesData.map((p, i) => p.selected ? i : -1).filter(i => i !== -1);
        const indices = selectedIndices.length > 0 ? selectedIndices : pagesData.map((_, i) => i);
        
        const copiedPages = await newPdf.copyPages(pdfLibDoc, indices);
        copiedPages.forEach(p => newPdf.addPage(p));
        
        const bytes = await newPdf.save();
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'output.pdf';
        a.click();
    }

    function deleteSelected() {
        pagesData = pagesData.filter(p => !p.selected);
        // 再描画のためPDF再ロード
        reRender();
    }

    async function reRender() {
        const pdf = await pdfjsLib.getDocument({ data: originalBytes }).promise;
        render(pdf);
    }
</script>
</body>
</html>
